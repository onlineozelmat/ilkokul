<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yaz Günü — Saat & Süre Oyunu (3. Sınıf)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#3FB4F0; --sun:#FFC531; --coral:#FF7A6B; --aqua:#2FCFC4;
    --green:#4FCB77; --purple:#8B6BFF; --ink:#1f4a5c; --card:#ffffff; --soft:#E6F6FF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Nunito',system-ui,sans-serif;
    background:radial-gradient(1100px 720px at 25% -8%, #BFEBFF 0%, #7FD6FF 42%, #58C6E8 100%);
    color:var(--ink); min-height:100vh; overflow-x:hidden;
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  h1,h2,h3,.display{font-family:'Baloo 2',system-ui,sans-serif;}

  .sky{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
  .sky i{position:absolute; font-size:24px; opacity:.18; animation:drift 11s linear infinite;}
  @keyframes drift{from{transform:translateY(15px) rotate(-6deg)}to{transform:translateY(-30px) rotate(10deg)}}

  .stage{position:relative; z-index:2; width:100%; max-width:640px;
    background:var(--card); border-radius:32px; padding:24px 22px 28px;
    box-shadow:0 22px 54px rgba(20,80,110,.35), inset 0 0 0 4px #fff;
    animation:pop .45s cubic-bezier(.2,1.3,.4,1);}
  @keyframes pop{from{transform:translateY(24px) scale(.94); opacity:0}to{transform:none; opacity:1}}

  .rail{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
  .track{flex:1; height:15px; border-radius:20px; background:var(--soft); position:relative; overflow:hidden;}
  .fill{position:absolute; inset:0 auto 0 0; width:0%; border-radius:20px;
    background:linear-gradient(90deg,var(--sun),var(--coral),var(--aqua)); transition:width .5s;}
  .badgemini{font-size:24px;}
  .scorebox{font-family:'Baloo 2'; font-weight:800; color:var(--sky); font-size:20px; white-space:nowrap;}

  .stage-tag{display:inline-block; font-family:'Baloo 2'; font-weight:700; font-size:14px;
    color:#fff; background:var(--coral); padding:4px 14px; border-radius:999px; margin-bottom:8px;}
  .scene-emoji{font-size:52px; text-align:center; line-height:1; margin:2px 0 4px; animation:bob 2.4s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .story{font-size:19px; line-height:1.5; font-weight:700; color:var(--ink); margin-bottom:4px; text-align:center;}
  .story b{color:var(--coral);}
  .question{font-family:'Baloo 2'; font-weight:700; font-size:23px; color:var(--ink); margin:12px 0 12px; text-align:center;}

  .opts{display:grid; gap:12px; grid-template-columns:1fr 1fr;}
  .opt{font-family:'Baloo 2'; font-weight:700; font-size:24px; color:#fff; border:none; cursor:pointer;
    padding:18px 10px; border-radius:22px; box-shadow:0 6px 0 rgba(0,0,0,.18); transition:transform .12s, filter .12s;}
  .opt:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.18);} .opt:hover{filter:brightness(1.06);}
  .opt.c0{background:var(--coral)} .opt.c1{background:var(--sky)} .opt.c2{background:var(--purple)} .opt.c3{background:var(--green)}

  .padwrap{display:flex; flex-direction:column; align-items:center; gap:12px;}
  .display-num{font-family:'Baloo 2'; font-weight:800; font-size:42px; color:var(--ink);
    background:var(--soft); min-width:150px; text-align:center; padding:8px 24px; border-radius:20px; letter-spacing:2px;}
  .pad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:100%; max-width:300px;}
  .key{font-family:'Baloo 2'; font-weight:700; font-size:26px; padding:14px 0; border:none; cursor:pointer;
    border-radius:16px; background:#fff; color:var(--ink); box-shadow:0 4px 0 #c8ebff, inset 0 0 0 2px #e6f6ff;}
  .key:active{transform:translateY(3px); box-shadow:0 1px 0 #c8ebff, inset 0 0 0 2px #e6f6ff;}
  .key.act{background:var(--sky); box-shadow:0 4px 0 #2b96cf; color:#fff;}
  .key.go{background:var(--green); box-shadow:0 4px 0 #2c854e; color:#fff;}

  .cta{font-family:'Baloo 2'; font-weight:800; font-size:22px; color:#fff; border:none; cursor:pointer;
    background:var(--green); padding:14px 34px; border-radius:20px; box-shadow:0 6px 0 #2c854e; margin-top:6px;}
  .cta:active{transform:translateY(4px); box-shadow:0 2px 0 #2c854e;} .cta.big{display:block; margin:20px auto 0;}
  .cta.sun{background:var(--sun); color:#5a4200; box-shadow:0 6px 0 #d9a520;} .cta.sun:active{box-shadow:0 2px 0 #d9a520;}

  .feedback{margin-top:14px; text-align:center; font-family:'Baloo 2'; font-weight:800; font-size:21px; min-height:26px;}
  .feedback.ok{color:var(--green);} .feedback.no{color:var(--coral);} .feedback.hint{color:var(--sky);}
  .hintline{text-align:center; color:#5b93ad; font-weight:700; margin-top:8px; font-size:15px;}
  .think{background:var(--soft); border-radius:18px; padding:12px 16px; margin:14px 0 6px;
    font-weight:700; color:#2c7fb0; font-size:17px; display:flex; gap:10px; align-items:flex-start;}
  .think::before{content:"⏰"; font-size:20px;}
  .shake{animation:shk .4s;} @keyframes shk{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(6px)}50%{transform:translateX(-8px)}}

  .burst{position:fixed; inset:0; pointer-events:none; z-index:9; overflow:hidden;}
  .burst span{position:absolute; top:40%; font-size:26px; animation:fly 1s ease-out forwards;}
  @keyframes fly{to{transform:translate(var(--tx),var(--ty)) rotate(var(--r)); opacity:0}}

  .start-title{font-size:36px; text-align:center; color:var(--ink); line-height:1.1; margin:6px 0;}
  .start-sub{text-align:center; font-weight:700; color:#3a86ad; font-size:17px; margin-bottom:6px;}
  .heroes{font-size:60px; text-align:center; margin:6px 0;}

  @media (max-width:480px){ .story{font-size:17px} .question{font-size:20px} .opt{font-size:20px; padding:16px 8px}
    .start-title{font-size:28px} }
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;}}
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<div class="burst" id="burst"></div>
<div class="stage" id="stage"></div>

<script>
/* ---- analog saat çizici ---- */
function clockSVG(h,m){
  const cx=95,cy=95,r=80; let ticks='';
  for(let i=0;i<12;i++){ const a=i*30*Math.PI/180;
    const x1=cx+Math.sin(a)*r, y1=cy-Math.cos(a)*r, x2=cx+Math.sin(a)*(r-11), y2=cy-Math.cos(a)*(r-11);
    ticks+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#2c7fb0" stroke-width="${i%3===0?4:2}"/>`; }
  const nums=[[12,0],[3,90],[6,180],[9,270]].map(([n,deg])=>{const a=deg*Math.PI/180;
    const x=cx+Math.sin(a)*(r-26), y=cy-Math.cos(a)*(r-26)+6;
    return `<text x="${x}" y="${y}" text-anchor="middle" font-family="Baloo 2" font-weight="800" font-size="19" fill="#1f4a5c">${n}</text>`;}).join('');
  const ha=((h%12)+m/60)*30*Math.PI/180, ma=m*6*Math.PI/180;
  const hx=cx+Math.sin(ha)*44, hy=cy-Math.cos(ha)*44, mx=cx+Math.sin(ma)*64, my=cy-Math.cos(ma)*64;
  return `<svg viewBox="0 0 190 190" width="186">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="var(--aqua)" stroke-width="6"/>
    ${ticks}${nums}
    <line x1="${cx}" y1="${cy}" x2="${hx}" y2="${hy}" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy}" x2="${mx}" y2="${my}" stroke="var(--coral)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="6" fill="var(--ink)"/>
  </svg>`;
}

const SAHNELER = [
  { tag:"Görev 1 · Saat Kaç?", emoji:"🌅",
    story:"<b>Deniz</b> yaz sabahı erken kalktı. Duvardaki saate baktı. (Dikkat: saat ibresi 11'e yakın ama daha 11 olmadı!)",
    gorsel:clockSVG(10,50),
    question:"Saat kaç?", type:"choice", options:["10:50","11:50","10:10","09:50"], answer:0,
    ok:"Doğru! Saat 10:50. 🌅",
    think:"En sık tuzak: akrep 11'e yakın diye 11:50 demek. Ama yelkovan 10'da (50 dakika), akrep henüz 11'e VARMADI → saat 10:50." },

  { tag:"Görev 2 · Çeyrek Kala", emoji:"🏐",
    story:"Deniz'in <b>voleybol antrenmanı 14:00'te</b> başlıyor. Deniz salona tam <b>“çeyrek kala”</b> vardı.",
    question:"Deniz salona saat kaçta vardı?", type:"choice", options:["13:45","14:15","13:15","14:45"], answer:0,
    ok:"Süper! “Çeyrek kala” = 15 dakika önce → 13:45. 🏐",
    think:"“Çeyrek” = 15 dakika. “Kala” = önce, “geçe” = sonra. 14:00'e çeyrek kala = 13:45." },

  { tag:"Görev 3 · Ne Kadar Yüzdü?", emoji:"🏊‍♀️",
    story:"Deniz havuzda <b>11:20'de</b> yüzmeye başladı, <b>12:05'te</b> çıktı.",
    gorsel:clockSVG(11,20)+clockSVG(12,5),
    question:"Deniz kaç DAKİKA yüzdü?", type:"input", answer:45,
    hint:"İki adımda düşün: 11:20'den 12:00'a kaç dakika, sonra 12:00'dan 12:05'e kaç dakika.",
    check:v=>v===45?true:(v<45?"Az saydın ⬆":"Çok saydın ⬇"),
    ok:"Harika! 11:20→12:00 = 40 dk, +5 dk = 45 dakika. 🏊‍♀️",
    think:"Saati aşan süre hesabında saat başını (12:00) ara basamak yap: önce oraya, sonra ötesine." },

  { tag:"Görev 4 · Antrenman Bitişi", emoji:"⏱️",
    story:"Öğleden sonra voleybol antrenmanı <b>17:30'da</b> başladı ve <b>1 saat 45 dakika</b> sürdü.",
    question:"Antrenman saat kaçta bitti?", type:"choice", options:["19:15","18:15","19:45","18:45"], answer:0,
    ok:"Doğru! 17:30 + 1 saat = 18:30, + 45 dk = 19:15. ⏱️",
    think:"Önce saati ekle (17:30→18:30), sonra dakikayı: 30+45=75 dk = 1 saat 15 dk → 19:15." },

  { tag:"Görev 5 · Dönüşüm", emoji:"📚",
    story:"Deniz ödevlerini severek yapar. Bugün tam <b>2 saat 10 dakika</b> çalıştı.",
    question:"Bu süre kaç DAKİKA eder?", type:"input", answer:130,
    hint:"1 saat = 60 dakika. Önce 2 saati dakikaya çevir, sonra 10'u ekle.",
    check:v=>v===130?true:(v<130?"Az ⬆":"Çok ⬇"),
    ok:"Müthiş! 2 × 60 = 120, + 10 = 130 dakika. 📚",
    think:"Saati dakikaya çevirmek için 60 ile çarparsın: 2 saat = 120 dakika." },

  { tag:"Görev 6 · Toplam Spor", emoji:"💪",
    story:"Deniz bugün <b>45 dakika voleybol</b> ve <b>35 dakika yüzme</b> yaptı.",
    question:"Toplam kaç DAKİKA spor yaptı?", type:"input", answer:80,
    hint:"İki süreyi topla: 45 + 35.",
    check:v=>v===80?true:(v<80?"Az ⬆":"Çok ⬇"),
    ok:"Bravo! 45 + 35 = 80 dakika spor. 💪",
    think:"80 dakika = 60 + 20 = 1 saat 20 dakika. Yani Deniz bugün 1 saatten FAZLA spor yaptı!" },

  { tag:"Son Görev · Günün Planı", emoji:"🗓️",
    story:"Deniz'in sabah planı: Saat <b>10:00'da yüzmeye</b> başlıyor (50 dakika sürüyor), sonra <b>30 dakika dinleniyor</b>, ardından voleybola gidiyor.",
    question:"Voleybol saat kaçta başlar?", type:"choice", options:["11:20","11:00","10:50","11:30"], answer:0,
    ok:"Tebrikler Deniz! 10:00 + 50 dk = 10:50, + 30 dk = 11:20. Planın hazır! 🗓️",
    think:"Zincirleme süre: her adımı sırayla ekle. 10:00 →(+50)→ 10:50 →(+30)→ 11:20." }
];

let idx=0, score=0, current=null, typedNum='';
const stage=document.getElementById('stage'), burst=document.getElementById('burst');
const TOTAL=SAHNELER.length;

(function(){ const em=["☀️","🏐","🏊‍♀️","⏰","🌊","🕐","🏖️","🐚"]; let s='';
  for(let i=0;i<16;i++){s+=`<i style="left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*11}s">${em[i%em.length]}</i>`;}
  document.getElementById('sky').innerHTML=s; })();

function railHTML(){ const pct=Math.round((score/TOTAL)*100);
  return `<div class="rail"><div class="track"><div class="fill" style="width:${pct}%"></div></div>
    <span class="badgemini">☀️</span><span class="scorebox">⭐ ${score}/${TOTAL}</span></div>`; }

function burstFx(){ const emo=["⭐","☀️","🎉","🏐","✨"]; let h='';
  for(let i=0;i<18;i++){ const tx=(Math.random()*2-1)*60+'vw', ty=(Math.random()*-1-0.2)*60+'vh', r=(Math.random()*720-360)+'deg';
    h+=`<span style="left:${40+Math.random()*20}%;--tx:${tx};--ty:${ty};--r:${r}">${emo[i%emo.length]}</span>`; }
  burst.innerHTML=h; setTimeout(()=>burst.innerHTML='',1000); }

function showStart(){
  stage.innerHTML=`<div class="heroes">👧☀️</div>
    <h1 class="start-title">Yaz Günü</h1>
    <p class="start-sub">Voleybol, yüzme ve güzel bir yaz günü! Deniz'in gününü planlamak için saatleri oku, süreleri hesapla.</p>
    <div class="scene-emoji">🏐🏊‍♀️⏰</div>
    <button class="cta sun big" onclick="startGame()">Güne Başla ▶</button>
    <p class="hintline">7 görev var. Meydan okuma modu — dikkatli oku! ⏰</p>`;
}
function startGame(){ idx=0; score=0; renderStage(); }

function renderStage(){
  current=SAHNELER[idx]; typedNum='';
  let body='';
  if(current.type==='choice'){
    body=`<div class="opts">`+current.options.map((o,k)=>
      `<button class="opt c${k}" onclick="answerChoice(${k},this)">${o}</button>`).join('')+`</div>`;
  } else {
    body=`<div class="padwrap"><div class="display-num" id="disp">0</div>
      <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" onclick="press(${n})">${n}</button>`).join('')}
      <button class="key act" onclick="press('del')">⌫</button>
      <button class="key" onclick="press(0)">0</button>
      <button class="key go" onclick="checkNum()">✓</button></div></div>`;
  }
  stage.innerHTML=railHTML()+`
    <span class="stage-tag">${current.tag}</span>
    <div class="scene-emoji">${current.emoji}</div>
    <div class="story">${current.story}</div>
    ${current.gorsel?`<div style="display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:14px;margin:10px 0">${current.gorsel}</div>`:''}
    <div class="question">${current.question}</div>
    ${body}
    <div class="hintline">${current.hint||''}</div>
    <div class="feedback" id="fb"></div>`;
}

function press(k){ const d=document.getElementById('disp');
  if(k==='del') typedNum=typedNum.slice(0,-1); else if(typedNum.length<3) typedNum+=k;
  d.textContent=typedNum===''?'0':typedNum; }

function checkNum(){ if(typedNum==='') return; const v=parseInt(typedNum,10);
  const res=current.check?current.check(v):(v===current.answer);
  if(res===true) win();
  else{ const fb=document.getElementById('fb'); fb.className='feedback hint';
    fb.textContent=(typeof res==='string')?res:"Tekrar dene 💪"; typedNum=''; document.getElementById('disp').textContent='0'; } }

function answerChoice(k,btn){ if(k===current.answer) win();
  else{ sesYanlis();btn.classList.add('shake'); setTimeout(()=>btn.classList.remove('shake'),400);
    const fb=document.getElementById('fb'); fb.className='feedback no'; fb.textContent="Olmadı — saati tekrar oku ⏰"; } }

function win(){ score++; burstFx();
  const tb=current.think?`<div class="think">${current.think}</div>`:'';
  const last=idx===TOTAL-1;
  stage.innerHTML=railHTML()+`
    <span class="stage-tag" style="background:var(--green)">✓ Doğru!</span>
    <div class="scene-emoji">${current.emoji}</div>
    ${current.gorsel?`<div style="display:flex;justify-content:center;gap:14px;margin:8px 0">${current.gorsel}</div>`:''}
    <div class="feedback ok" style="font-size:22px">${current.ok}</div>
    ${tb}
    <button class="cta ${last?'sun ':''}big" onclick="${last?'showEnd()':'next()'}">${last?'Günü Bitir 🏁':'Devam Et ➜'}</button>`;
}
function next(){ idx++; renderStage(); }

function showEnd(){
  stage.innerHTML=`<div class="heroes">🎉👧☀️</div>
    <h1 class="start-title">Aferin Deniz!</h1>
    <p class="start-sub">Bütün saatleri okudun, süreleri hesapladın ve gününü planladın. Harika bir yaz günü!</p>
    <div class="display-num" style="display:block;margin:14px auto;font-size:32px;">⭐ ${score}/${TOTAL}</div>
    <div class="think" style="justify-content:center">Yarın da voleybol ve yüzme var — kendi planını sen kur: kaçta başlar, kaçta biter?</div>
    <button class="cta sun big" onclick="startGame()">Yeniden Oyna 🔁</button>`;
  burstFx();
}

document.addEventListener('keydown',e=>{ if(!current||current.type!=='input') return;
  if(/[0-9]/.test(e.key)) press(parseInt(e.key,10));
  else if(e.key==='Backspace') press('del'); else if(e.key==='Enter') checkNum(); });

showStart();

/* === SES MOTORU (power-up doğru / buzzer yanlış) === */
(function(){
  var sesAcik=true, actx=null, sonSes=0;
  function AC(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } } return actx; }
  function ton(f,st,du,tp,vol){ var a=AC(); if(!a) return; var o=a.createOscillator(), g=a.createGain();
    o.type=tp||'sine'; o.frequency.value=f; o.connect(g); g.connect(a.destination);
    var t=a.currentTime+st; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+du); o.start(t); o.stop(t+du+0.03); }
  function gate(){ var n=Date.now(); if(n-sonSes<120) return false; sonSes=n; return true; }
  window.sesDogru=function(){ if(!sesAcik||!gate()) return; [392,523,659,784,988,1319].forEach(function(f,i){ ton(f,i*0.05,0.12,'square',0.16); }); };
  window.sesYanlis=function(){ if(!sesAcik||!gate()) return; ton(300,0,0.16,'sawtooth',0.2); ton(200,0.15,0.22,'sawtooth',0.2); };
  window.sesToggle=function(){ sesAcik=!sesAcik; var b=document.getElementById('sesBtn'); if(b) b.textContent=sesAcik?'🔊':'🔇'; };
  function ekleBtn(){ if(document.getElementById('sesBtn')) return; var b=document.createElement('button'); b.id='sesBtn';
    b.textContent='🔊'; b.title='Ses aç/kapa'; b.setAttribute('onclick','sesToggle()');
    b.style.cssText='position:fixed;top:10px;right:10px;z-index:9999;border:none;cursor:pointer;font-size:20px;background:rgba(255,255,255,.9);border-radius:999px;width:42px;height:42px;box-shadow:0 3px 8px rgba(0,0,0,.25)';
    if(document.body) document.body.appendChild(b); }
  if(document.readyState!=='loading') ekleBtn(); else document.addEventListener('DOMContentLoaded',ekleBtn);
  function sar(name,ses){ if(typeof window[name]==='function'){ var o=window[name]; window[name]=function(){ ses(); return o.apply(this,arguments); }; return true; } return false; }
  sar('burstFx',window.sesDogru) || sar('starBurst',window.sesDogru);
  sar('wrong',window.sesYanlis); sar('yanlis',window.sesYanlis);
})();

</script>
</body>
</html>
