<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terazi Ustası — Tartma & Birim Çevirme (4. Sınıf)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --brass:#C98A3C; --brass2:#a86f28; --teal:#2FB6A8; --sky:#4EC5FF; --sun:#FFC531;
    --green:#4FCB77; --coral:#FF7A6B; --purple:#8B6BFF; --ink:#3a2a12; --card:#ffffff; --soft:#FBEFDA;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Nunito',system-ui,sans-serif;
    background:radial-gradient(1100px 720px at 25% -8%, #F4E3C4 0%, #EAD3A6 42%, #D9BE86 100%);
    color:var(--ink); min-height:100vh; overflow-x:hidden;
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  h1,h2,h3{font-family:'Baloo 2',system-ui,sans-serif;}
  .sky{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
  .sky i{position:absolute; font-size:22px; opacity:.16; animation:bob 4s ease-in-out infinite;}
  @keyframes bob{50%{transform:translateY(-9px)}}

  .stage{position:relative; z-index:2; width:100%; max-width:640px;
    background:var(--card); border-radius:32px; padding:24px 22px 28px;
    box-shadow:0 22px 54px rgba(80,50,10,.34), inset 0 0 0 4px #fff; animation:pop .4s cubic-bezier(.2,1.3,.4,1);}
  @keyframes pop{from{transform:translateY(20px) scale(.95); opacity:0}to{transform:none; opacity:1}}

  .rail{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .track{flex:1; height:14px; border-radius:20px; background:var(--soft); position:relative; overflow:hidden;}
  .fill{position:absolute; inset:0 auto 0 0; width:0%; border-radius:20px;
    background:linear-gradient(90deg,var(--teal),var(--sun),var(--brass)); transition:width .4s;}
  .scorebox{font-family:'Baloo 2'; font-weight:800; color:var(--brass2); font-size:18px; white-space:nowrap;}

  /* ---------- TERAZİ ---------- */
  .terazi{width:100%; max-width:440px; margin:2px auto 6px;}
  .beam-wrap{position:relative; height:170px;}
  .stand{position:absolute; left:50%; bottom:0; transform:translateX(-50%); width:14px; height:96px;
    background:linear-gradient(90deg,#b98a3e,var(--brass2)); border-radius:6px;}
  .stand::after{content:''; position:absolute; bottom:-8px; left:-28px; width:70px; height:12px; border-radius:8px; background:var(--brass2);}
  .beam{position:absolute; left:50%; top:44px; width:330px; height:12px; background:linear-gradient(90deg,var(--brass),var(--brass2));
    border-radius:8px; transform:translateX(-50%) rotate(0deg); transform-origin:center; transition:transform .6s cubic-bezier(.3,1.1,.4,1);}
  .pan{position:absolute; top:40px; width:132px; text-align:center; transition:transform .6s cubic-bezier(.3,1.1,.4,1);}
  .pan.l{left:0;} .pan.r{right:0;}
  .rope{width:2px; height:30px; background:#9a7530; margin:0 auto;}
  .wblock{background:linear-gradient(180deg,#e0b070,var(--brass)); color:#fff; font-family:'Baloo 2'; font-weight:800;
    font-size:20px; border-radius:8px 8px 16px 16px; padding:12px 8px; min-height:56px; box-shadow:0 4px 0 var(--brass2);
    display:flex; align-items:center; justify-content:center;}
  .wblock.q{background:linear-gradient(180deg,#cfe7f6,var(--sky)); color:#0a4f6a;}
  .wblock.empty{background:#f0e6d4; color:#b79a6a; box-shadow:0 4px 0 #d9c7a8;}
  .beam.solAgir{transform:translateX(-50%) rotate(-10deg);} .beam.sagAgir{transform:translateX(-50%) rotate(10deg);}
  .pan.l.solAgir{transform:translateY(30px);} .pan.r.solAgir{transform:translateY(-30px);}
  .pan.l.sagAgir{transform:translateY(-30px);} .pan.r.sagAgir{transform:translateY(30px);}

  .porttag,.stage-tag{display:inline-block; font-family:'Baloo 2'; font-weight:800; font-size:14px; color:#fff;
    background:var(--brass); padding:4px 14px; border-radius:999px; margin-bottom:6px;}
  .story{font-size:18px; line-height:1.5; font-weight:700; color:var(--ink); text-align:center; margin-top:4px;}
  .story b{color:var(--coral);}
  .question{font-family:'Baloo 2'; font-weight:700; font-size:22px; color:var(--ink); text-align:center; margin:10px 0 12px;}

  .padwrap{display:flex; flex-direction:column; align-items:center; gap:12px;}
  .display-num{font-family:'Baloo 2'; font-weight:800; font-size:38px; color:var(--ink);
    background:var(--soft); min-width:150px; text-align:center; padding:8px 18px; border-radius:20px;}
  .unit{font-size:22px; color:#a9814a;}
  .pad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:100%; max-width:300px;}
  .key{font-family:'Baloo 2'; font-weight:700; font-size:26px; padding:14px 0; border:none; cursor:pointer;
    border-radius:16px; background:#fff; color:var(--ink); box-shadow:0 4px 0 #ecd9b6, inset 0 0 0 2px #fbefda;}
  .key:active{transform:translateY(3px); box-shadow:0 1px 0 #ecd9b6, inset 0 0 0 2px #fbefda;}
  .key.act{background:var(--brass); box-shadow:0 4px 0 var(--brass2); color:#fff;}
  .key.go{background:var(--sun); box-shadow:0 4px 0 #d9a520; color:#5a4200;}

  .opts{display:grid; grid-template-columns:1fr 1fr; gap:14px; max-width:360px; margin:0 auto;}
  .opt{font-family:'Baloo 2'; font-weight:800; font-size:22px; color:#fff; border:none; cursor:pointer;
    padding:18px 8px; border-radius:20px; box-shadow:0 6px 0 rgba(0,0,0,.18);}
  .opt:active{transform:translateY(4px);} .opt.o0{background:var(--teal)} .opt.o1{background:var(--purple)} .opt.o2{background:var(--coral)}

  .tiles{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:4px 0;}
  .tile{font-family:'Baloo 2'; font-weight:800; font-size:17px; color:#fff; border:none; cursor:pointer;
    padding:14px 16px; border-radius:16px; background:var(--brass); box-shadow:0 5px 0 var(--brass2);}
  .tile:active{transform:translateY(3px);} .tile.reset{background:#b7a98f; box-shadow:0 5px 0 #8f8168;}

  .cta{font-family:'Baloo 2'; font-weight:800; font-size:22px; color:#fff; border:none; cursor:pointer;
    background:var(--teal); padding:14px 28px; border-radius:20px; box-shadow:0 6px 0 #1f8a80; margin-top:6px;}
  .cta:active{transform:translateY(4px); box-shadow:0 2px 0 #1f8a80;} .cta.big{display:block; margin:16px auto 0;}
  .cta.sun{background:var(--sun);color:#5a4200;box-shadow:0 6px 0 #d9a520}

  .feedback{margin-top:12px; text-align:center; font-family:'Baloo 2'; font-weight:800; font-size:20px; min-height:24px;}
  .feedback.ok{color:var(--green);} .feedback.no{color:var(--coral);} .feedback.hint{color:var(--brass2);}
  .think{background:var(--soft); border-radius:16px; padding:12px 14px; margin:12px 0 4px;
    font-weight:700; color:#8a5a1e; font-size:16px; display:flex; gap:8px; align-items:flex-start;}
  .think::before{content:"⚖️"; font-size:18px;}

  .burst{position:fixed; inset:0; pointer-events:none; z-index:9; overflow:hidden;}
  .burst span{position:absolute; top:40%; font-size:26px; animation:fly 1.1s ease-out forwards;}
  @keyframes fly{to{transform:translate(var(--tx),var(--ty)) rotate(var(--r)); opacity:0}}

  .start-title{font-size:32px; text-align:center; color:var(--ink); line-height:1.1; margin:6px 0;}
  .start-sub{text-align:center; font-weight:700; color:#a9814a; font-size:17px; margin-bottom:6px;}
  .heroes{font-size:56px; text-align:center; margin:4px 0;}

  @media (max-width:480px){ .story{font-size:16px} .question{font-size:19px} .start-title{font-size:26px}
    .beam{width:270px} .pan{width:112px} .wblock{font-size:17px} }
  @media (prefers-reduced-motion:reduce){*{animation:none !important; transition:transform .3s !important;}}
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<div class="burst" id="burst"></div>
<div class="stage" id="stage"></div>

<script>
/* Tüm kütleler dahili olarak GRAM. 1 kg=1000 g, 1 ton=1000 kg=1000000 g
   type: 'denge' (hafif kefeye kaç eklemeli), 'cevir' (birim çevir), 'karsilastir', 'insa' (taşlarla denge), 'toplam' */
const TURLAR = [
  { type:'denge', tag:"Tur 1 · Dengele",
    story:"Terazinin sol kefesi ağır. Sağ kefeye ekleyip dengele.",
    solG:750, sagG:400, solEt:"750 g", sagEt:"400 g", birim:"g", cevap:350,
    ok:"⚖️ 750 − 400 = 350 g eklenince terazi dengelendi!",
    think:"Dengelemek için fark kadar eklersin: ağır − hafif." },

  { type:'cevir', tag:"Tur 2 · Çevir",
    story:"Sol kefede 4 kg'lık bir ağırlık var.",
    solEt:"4 kg", question:"4 kilogram kaç GRAM eder?", birim:"g", cevap:4000,
    ok:"⚖️ 1 kg = 1000 g olduğu için 4 kg = 4000 g.",
    think:"Kilogramı grama çevirmek için 1000 ile çarparsın." },

  { type:'denge', tag:"Tur 3 · Çevir + Dengele",
    story:"Dikkat! Kefeler farklı birimde. Önce aynı birime çevir.",
    solG:1000, sagG:600, solEt:"1 kg", sagEt:"600 g", birim:"g", cevap:400,
    ok:"⚖️ 1 kg = 1000 g. 1000 − 600 = 400 g eklenince denge sağlandı!",
    think:"Farklı birimleri karşılaştırmadan önce aynı birime çevir (1 kg → 1000 g)." },

  { type:'karsilastir', tag:"Tur 4 · Hangisi Ağır?",
    story:"İki kefe farklı birimde. Hangisi daha ağır?",
    solG:2000, sagG:1800, solEt:"2 kg", sagEt:"1800 g",
    question:"Hangi kefe daha AĞIR?", secenekler:["Sol (2 kg)","Sağ (1800 g)"], dogru:0,
    ok:"⚖️ 2 kg = 2000 g. 2000 > 1800, yani sol kefe daha ağır.",
    think:"Karşılaştırmak için ikisini de grama çevir: 2 kg = 2000 g." },

  { type:'insa', tag:"Tur 5 · Taşlarla Denge",
    story:"Sol kefede 1 kg 300 g var. Sağ kefeye standart tartı taşları koyup tam dengele.",
    solG:1300, solEt:"1 kg 300 g", hedef:1300, taslar:[1000,500,100],
    ok:"⚖️ Sağ kefe tam 1300 g oldu — terazi dengede!",
    think:"1 kg 300 g = 1300 g. Taşları toplayıp bu sayıya ulaştın." },

  { type:'toplam', tag:"Tur 6 · Topla",
    story:"İki çuval tartıldı: biri 2 kg 500 g, diğeri 1 kg 800 g.",
    solEt:"2 kg 500 g", sagEt:"1 kg 800 g", question:"İkisi toplam kaç GRAM eder?", birim:"g", cevap:4300,
    ok:"⚖️ 2500 g + 1800 g = 4300 g.",
    think:"Önce ikisini grama çevir (2500 ve 1800), sonra topla." },

  { type:'cevir', tag:"Tur 7 · Büyük Birim",
    story:"Bir kamyon 3 ton yük taşıyor.",
    solEt:"3 ton", question:"3 ton kaç KİLOGRAM eder?", birim:"kg", cevap:3000,
    ok:"⚖️ 1 ton = 1000 kg olduğu için 3 ton = 3000 kg.",
    think:"Büyük birimden küçüğe: tonu kg'a çevirmek için 1000 ile çarp." },

  { type:'denge', tag:"Son Tur · Usta Dengesi",
    story:"Son görev! Kefeleri aynı birime getirip dengele.",
    solG:1500, sagG:900, solEt:"1 kg 500 g", sagEt:"900 g", birim:"g", cevap:600,
    ok:"⚖️ 1 kg 500 g = 1500 g. 1500 − 900 = 600 g. Terazi ustası oldun!",
    think:"1 kg 500 g = 1500 g. Fark = 1500 − 900 = 600 g." }
];

let ri=0, typedNum='', current=null, busy=false, insaSel=[];
const stage=document.getElementById('stage'), burst=document.getElementById('burst');
const TOTAL=TURLAR.length;

(function(){ const em=["⚖️","🏋️","📦","🪙","⚓"]; let s='';
  for(let i=0;i<12;i++) s+=`<i style="left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*4}s">${em[i%em.length]}</i>`;
  document.getElementById('sky').innerHTML=s; })();

function burstFx(set){ const emo=set||["⚖️","⭐","🎉","✨"]; let h='';
  for(let i=0;i<16;i++){ const tx=(Math.random()*2-1)*55+'vw', ty=(Math.random()*-1-0.2)*55+'vh', r=(Math.random()*720-360)+'deg';
    h+=`<span style="left:${40+Math.random()*20}%;--tx:${tx};--ty:${ty};--r:${r}">${emo[i%emo.length]}</span>`; }
  burst.innerHTML=h; setTimeout(()=>burst.innerHTML='',1100); }

function durumHesap(sol,sag){ return sol>sag?'solAgir':(sag>sol?'sagAgir':''); }

/* terazi HTML — sol/sag etiketleri ve eğim */
function teraziHTML(solEt,sagEt,durum,solQ,sagQ){
  const cls=s=> s? (s==='q'?'wblock q':(s==='empty'?'wblock empty':'wblock')) : 'wblock';
  return `<div class="terazi"><div class="beam-wrap">
    <div class="beam ${durum}" id="beam"></div>
    <div class="pan l ${durum}" id="panL"><div class="rope"></div><div class="${cls(solQ)}" id="wL">${solEt}</div></div>
    <div class="pan r ${durum}" id="panR"><div class="rope"></div><div class="${cls(sagQ)}" id="wR">${sagEt}</div></div>
    <div class="stand"></div>
  </div></div>`;
}

function showStart(){
  stage.innerHTML=`
    ${teraziHTML("g","kg","",null,null)}
    <div class="heroes">⚖️</div>
    <h1 class="start-title">Terazi Ustası</h1>
    <p class="start-sub">Kefeleri dengele, birimleri çevir! g · kg · ton ile 8 tartı görevi. Her denge seni ustalığa yaklaştırır. ⚖️</p>
    <button class="cta sun big" onclick="startGame()">Teraziyi Kur ▶</button>`;
}
function startGame(){ ri=0; renderTur(); }

function railHTML(){ const pct=Math.round((ri/TOTAL)*100);
  return `<div class="rail"><div class="track"><div class="fill" style="width:${pct}%"></div></div>
    <span class="scorebox">⚖️ ${ri}/${TOTAL}</span></div>`; }

function renderTur(){ current=TURLAR[ri]; typedNum=''; busy=false; insaSel=[];
  let terazi='', body='';

  if(current.type==='denge'){
    terazi=teraziHTML(current.solEt, current.sagEt+' + ?', durumHesap(current.solG,current.sagG), null, 'q');
    body=`<div class="question">Dengelemek için sağ kefeye kaç ${current.birim.toUpperCase()} eklemeli?</div>${keypadHTML()}`;
  } else if(current.type==='cevir'){
    terazi=teraziHTML(current.solEt, "?", 'solAgir', null, 'q');
    body=`<div class="question">${current.question}</div>${keypadHTML()}`;
  } else if(current.type==='karsilastir'){
    terazi=teraziHTML(current.solEt, current.sagEt, durumHesap(current.solG,current.sagG), null, null);
    body=`<div class="question">${current.question}</div>
      <div class="opts">${current.secenekler.map((o,k)=>`<button class="opt o${k}" onclick="karsilastir(${k},this)">${o}</button>`).join('')}</div>`;
  } else if(current.type==='insa'){
    terazi=teraziHTML(current.solEt, "0 g", 'solAgir', null, 'empty');
    body=`<div class="question">Sağ kefeye taş ekle, tam dengele:</div>
      <div class="tiles">
        ${current.taslar.map(t=>`<button class="tile" onclick="insaEkle(${t})">${t>=1000?(t/1000)+' kg':t+' g'}</button>`).join('')}
        <button class="tile reset" onclick="insaSifirla()">↺ Sıfırla</button>
      </div>`;
  } else if(current.type==='toplam'){
    terazi=teraziHTML(current.solEt, current.sagEt, '', null, null);
    body=`<div class="question">${current.question}</div>${keypadHTML()}`;
  }

  stage.innerHTML=railHTML()+`
    <div style="text-align:center"><span class="stage-tag">${current.tag}</span></div>
    ${terazi}
    <div class="story">${current.story}</div>
    ${body}
    <div class="feedback" id="fb"></div>`;
}

function keypadHTML(){
  return `<div class="padwrap"><div class="display-num"><span id="disp">0</span> <span class="unit">${current.birim}</span></div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(k=>`<button class="key" onclick="press(${k})">${k}</button>`).join('')}
    <button class="key act" onclick="press('del')">⌫</button>
    <button class="key" onclick="press(0)">0</button>
    <button class="key go" onclick="kontrol()">✓</button></div></div>`;
}
function press(k){ if(busy) return; const d=document.getElementById('disp');
  if(k==='del') typedNum=typedNum.slice(0,-1); else if(typedNum.length<7) typedNum+=k;
  d.textContent=typedNum===''?'0':typedNum; }

function dogru(){ busy=true; burstFx(["⚖️","⭐","✨"]);
  // teraziyi dengeye getir
  ['beam','panL','panR'].forEach(id=>{const el=document.getElementById(id); if(el) el.classList.remove('solAgir','sagAgir');});
  ri++;
  const tb=current.think?`<div class="think">${current.think}</div>`:'';
  const son=ri===TOTAL;
  document.getElementById('fb').innerHTML=`<div class="feedback ok" style="font-size:21px">${current.ok}</div>${tb}
    <button class="cta ${son?'sun ':''}big" onclick="${son?'showEnd()':'renderTur()'}">${son?'Bitir 🏁':'Sonraki Tur ⚖️'}</button>`;
}
function yanlis(msg){ const fb=document.getElementById('fb'); fb.className='feedback hint'; fb.textContent=msg||"Tekrar dene 🙂"; }

function kontrol(){ if(busy||typedNum==='') return; const v=parseInt(typedNum,10);
  if(v===current.cevap){ // doğru kefeyi güncelle
    const wR=document.getElementById('wR'); if(wR && current.type==='denge'){ wR.classList.remove('q'); wR.textContent=current.solEt; }
    dogru();
  } else { yanlis(v<current.cevap?"Az geldi ⬆":"Çok geldi ⬇"); typedNum=''; document.getElementById('disp').textContent='0'; }
}
function karsilastir(k,btn){ if(busy) return;
  if(k===current.dogru) dogru();
  else{ btn.disabled=true; btn.style.opacity=.4; yanlis("Önce aynı birime çevir 👀"); } }

/* inşa (taşlarla denge) */
function insaEkle(t){ if(busy) return; insaSel.push(t); insaGuncelle(); }
function insaSifirla(){ if(busy) return; insaSel=[]; insaGuncelle(); }
function insaGuncelle(){ const sum=insaSel.reduce((a,b)=>a+b,0);
  const wR=document.getElementById('wR'); const beam=document.getElementById('beam');
  const panL=document.getElementById('panL'), panR=document.getElementById('panR');
  if(wR){ wR.textContent=sum+' g'; wR.classList.toggle('empty',sum===0); }
  const durum=durumHesap(current.hedef,sum); // sol=hedef, sag=sum
  [beam,panL,panR].forEach(el=>{ if(el){ el.classList.remove('solAgir','sagAgir'); if(durum) el.classList.add(durum);} });
  if(sum===current.hedef){ setTimeout(()=>{ if(!busy) dogru(); }, 400); }
  else if(sum>current.hedef){ const fb=document.getElementById('fb'); fb.className='feedback hint'; fb.textContent=`${sum} g — fazla oldu, sıfırla ⬇`; }
}

function showEnd(){ burstFx(["🏆","⚖️","⭐","🎉"]);
  stage.innerHTML=`
    ${teraziHTML("⭐","⭐","",null,null)}
    <div class="heroes">🏆⚖️</div>
    <h1 class="start-title">Terazi Ustası Oldun!</h1>
    <p class="start-sub">Kefeleri dengeledin, g · kg · ton arasında çevirdin, karşılaştırdın ve tarttın. Usta bir tartıcısın!</p>
    <div class="think" style="justify-content:center">Aklında kalsın: 1 kg = 1000 g, 1 ton = 1000 kg. Karşılaştırmadan önce hep aynı birime çevir.</div>
    <button class="cta sun big" onclick="startGame()">Yeniden Oyna 🔁</button>`;
}

document.addEventListener('keydown',e=>{ if(!current||busy||(current.type!=='denge'&&current.type!=='cevir'&&current.type!=='toplam')) return;
  if(/[0-9]/.test(e.key)) press(parseInt(e.key,10));
  else if(e.key==='Backspace') press('del'); else if(e.key==='Enter') kontrol(); });

showStart();

/* === SES MOTORU (power-up doğru / buzzer yanlış) === */
(function(){
  var sesAcik=true, actx=null, sonSes=0;
  function AC(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } } return actx; }
  function ton(f,st,du,tp,vol){ var a=AC(); if(!a) return; var o=a.createOscillator(), g=a.createGain();
    o.type=tp||'sine'; o.frequency.value=f; o.connect(g); g.connect(a.destination);
    var t=a.currentTime+st; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+du); o.start(t); o.stop(t+du+0.03); }
  function gate(){ var n=Date.now(); if(n-sonSes<120) return false; sonSes=n; return true; }
  window.sesDogru=function(){ if(!sesAcik||!gate()) return; [392,523,659,784,988,1319].forEach(function(f,i){ ton(f,i*0.05,0.12,'square',0.16); }); };
  window.sesYanlis=function(){ if(!sesAcik||!gate()) return; ton(300,0,0.16,'sawtooth',0.2); ton(200,0.15,0.22,'sawtooth',0.2); };
  window.sesToggle=function(){ sesAcik=!sesAcik; var b=document.getElementById('sesBtn'); if(b) b.textContent=sesAcik?'🔊':'🔇'; };
  function ekleBtn(){ if(document.getElementById('sesBtn')) return; var b=document.createElement('button'); b.id='sesBtn';
    b.textContent='🔊'; b.title='Ses aç/kapa'; b.setAttribute('onclick','sesToggle()');
