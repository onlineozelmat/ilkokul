<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kurbağa Sıçraması — Ritmik Sayma (2. Sınıf)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pond:#3FB6C4; --pond2:#2C93A0; --lily:#5FCB77; --lily2:#3fa85e; --sun:#FFC531;
    --coral:#FF7A6B; --green:#4FCB77; --ink:#15484f; --card:#ffffff; --soft:#E6F7F9;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Nunito',system-ui,sans-serif;
    background:radial-gradient(1100px 720px at 25% -8%, #CFF3F7 0%, #A6E6EC 42%, #7FD3DC 100%);
    color:var(--ink); min-height:100vh; overflow-x:hidden;
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  h1,h2,h3{font-family:'Baloo 2',system-ui,sans-serif;}
  .sky{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
  .sky i{position:absolute; font-size:24px; opacity:.16; animation:bob 4s ease-in-out infinite;}
  @keyframes bob{50%{transform:translateY(-9px)}}

  .stage{position:relative; z-index:2; width:100%; max-width:640px;
    background:var(--card); border-radius:32px; padding:22px 20px 26px;
    box-shadow:0 22px 54px rgba(20,72,79,.32), inset 0 0 0 4px #fff; animation:pop .4s cubic-bezier(.2,1.3,.4,1);}
  @keyframes pop{from{transform:translateY(18px) scale(.96); opacity:0}to{transform:none; opacity:1}}

  .top{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .stars{margin-left:auto; font-size:20px; font-weight:800; color:var(--sun); font-family:'Baloo 2';}
  .prog{text-align:center; font-family:'Baloo 2'; font-weight:800; color:#4a8f97; font-size:15px; margin-bottom:6px;}

  .soru{font-family:'Baloo 2'; font-weight:800; font-size:23px; color:var(--ink); text-align:center; margin:8px 0 10px;}
  .soru b{color:var(--coral);}

  .pond-wrap{background:linear-gradient(180deg,#bfeef3,var(--soft)); border-radius:20px; padding:16px 10px; margin:4px 0 8px; overflow-x:auto;}
  .frog{font-size:30px; text-align:left; margin-left:6px; animation:hop 1.3s ease-in-out infinite;}
  @keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}
  .pads{display:flex; align-items:center; justify-content:flex-start; gap:2px; flex-wrap:nowrap; min-width:min-content;}
  .pad{width:50px; height:50px; flex-shrink:0; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2'; font-weight:800; font-size:19px;}
  .pad.verili{background:radial-gradient(circle at 40% 35%, #8fe0a4, var(--lily)); box-shadow:0 4px 0 var(--lily2); color:#12532a;}
  .pad.dolu{background:radial-gradient(circle at 40% 35%, #b6f0c6, var(--green)); box-shadow:0 4px 0 #2f9f57; color:#fff;}
  .pad.aktif{background:#fff; box-shadow:0 0 0 3px var(--sun) inset, 0 4px 0 #e0b93a; color:#b58a12; animation:pulse 1s infinite;}
  .pad.bos{background:#e8f6f8; box-shadow:0 4px 0 #cfe6e9; color:#9dc3c9;}
  @keyframes pulse{50%{box-shadow:0 0 0 6px var(--sun) inset, 0 4px 0 #e0b93a;}}
  .arc{flex-shrink:0; font-family:'Baloo 2'; font-weight:800; font-size:12px; color:var(--pond2); padding:0 2px; white-space:nowrap;}

  .opts{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; max-width:420px; margin:8px auto 0;}
  .opt{font-family:'Baloo 2'; font-weight:800; font-size:26px; color:#fff; border:none; cursor:pointer;
    padding:16px 0; border-radius:18px; background:var(--pond); box-shadow:0 6px 0 var(--pond2); transition:.12s;}
  .opt:active{transform:translateY(4px);} .opt.wrong{opacity:.3;} .opt.shake{animation:shk .4s;}
  @keyframes shk{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(5px)}50%{transform:translateX(-7px)}}

  .msg{margin-top:14px; text-align:center; font-family:'Baloo 2'; font-weight:800; font-size:20px; min-height:24px;}
  .msg.ok{color:var(--green);} .msg.no{color:var(--coral);}
  .think{background:var(--soft); border-radius:16px; padding:12px 14px; margin:12px 0 4px; font-weight:700; color:#2c7a83; font-size:16px; text-align:center;}

  .cta{font-family:'Baloo 2'; font-weight:800; font-size:22px; color:#fff; border:none; cursor:pointer;
    background:var(--pond2); padding:14px 30px; border-radius:20px; box-shadow:0 6px 0 #1c6b76; margin-top:6px;}
  .cta:active{transform:translateY(4px); box-shadow:0 2px 0 #1c6b76;} .cta.big{display:block; margin:16px auto 0;}
  .cta.sun{background:var(--sun);color:#5a4200;box-shadow:0 6px 0 #d9a520}

  .burst{position:fixed; inset:0; pointer-events:none; z-index:9; overflow:hidden;}
  .burst span{position:absolute; top:40%; font-size:26px; animation:fly 1s ease-out forwards;}
  @keyframes fly{to{transform:translate(var(--tx),var(--ty)) rotate(var(--r)); opacity:0}}

  .start-title{font-size:32px; text-align:center; color:var(--ink); line-height:1.1; margin:6px 0;}
  .start-sub{text-align:center; font-weight:700; color:#3a8a92; font-size:16px; margin-bottom:6px;}
  .heroes{font-size:54px; text-align:center; margin:4px 0;}
  .adult{text-align:center; color:#6aa8b0; font-weight:700; font-size:13px; margin-top:12px;}
  @media (max-width:480px){ .soru{font-size:19px} .opt{font-size:22px} .pad{width:42px;height:42px;font-size:16px} .start-title{font-size:26px} }
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;}}
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<div class="burst" id="burst"></div>
<div class="stage" id="stage"></div>

<script>
function seri(say,n,geri){ let a=[]; for(let i=1;i<=n;i++) a.push(say*i); if(geri) a.reverse(); return a; }

/* Her tur: çok boşluklu bir dizi. bos = boşluk indeksleri. */
const TURLAR = [
  { say:2,  geri:false, tam:seri(2,10,false),  bos:[1,4,6,9], et:"+2",  baslik:"2'şer say, 20'ye kadar" },
  { say:3,  geri:false, tam:seri(3,10,false),  bos:[2,3,6,8], et:"+3",  baslik:"3'er say, 30'a kadar" },
  { say:4,  geri:false, tam:seri(4,10,false),  bos:[1,5,7,8], et:"+4",  baslik:"4'er say, 40'a kadar" },
  { say:5,  geri:false, tam:seri(5,10,false),  bos:[2,4,5,9], et:"+5",  baslik:"5'er say, 50'ye kadar" },
  { say:10, geri:false, tam:seri(10,10,false), bos:[1,3,7,8], et:"+10", baslik:"10'ar say, 100'e kadar" },
  { say:2,  geri:true,  tam:seri(2,10,true),   bos:[2,5,6,8], et:"−2",  baslik:"2'şer GERİ say" }
];

let idx=0, score=0, current=null, filled=null, aktif=-1, busy=false;
const stage=document.getElementById('stage'), burst=document.getElementById('burst');
const TOTAL=TURLAR.length;

(function(){ const em=["🐸","🪷","💧","🍃","🌸"]; let s='';
  for(let i=0;i<14;i++) s+=`<i style="left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*4}s">${em[i%em.length]}</i>`;
  document.getElementById('sky').innerHTML=s; })();

function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function secenekler(c,step){ const set=new Set([c]);
  [c-step,c+step,c-1,c+1,c+2*step].forEach(x=>{ if(x>0&&set.size<4) set.add(x); });
  while(set.size<4){ const x=c+step*rnd(-2,2)+rnd(-1,1); if(x>0) set.add(x); }
  return [...set].sort(()=>Math.random()-0.5); }
function burstFx(){ const emo=["⭐","🐸","🎉","💚"]; let h='';
  for(let i=0;i<16;i++){ const tx=(Math.random()*2-1)*55+'vw', ty=(Math.random()*-1-0.2)*55+'vh', r=(Math.random()*720-360)+'deg';
    h+=`<span style="left:${40+Math.random()*20}%;--tx:${tx};--ty:${ty};--r:${r}">${emo[i%emo.length]}</span>`; }
  burst.innerHTML=h; setTimeout(()=>burst.innerHTML='',1000); }

function showStart(){
  stage.innerHTML=`
    <div class="heroes">🐸🪷</div>
    <h1 class="start-title">Kurbağa Sıçraması</h1>
    <p class="start-sub">Kurbağa yapraktan yaprağa zıplıyor! Boşluktaki sayıları ritmik sayarak bul: 2'şer, 3'er, 4'er, 5'er, 10'ar. 🐸</p>
    <div class="heroes" style="font-size:30px">2️⃣ 3️⃣ 4️⃣ 5️⃣ 🔟</div>
    <button class="cta sun big" onclick="startGame()">Sıçramaya Başla ▶</button>
    <p class="adult">👩‍🏫 Yetişkin için: çocukla sesli sayın — "iki, dört, altı…" ritmi öğrenmeyi kolaylaştırır.</p>`;
}
function startGame(){ idx=0; score=0; startRound(); }
function karistirDizi(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function rastgeleBos(n){ return karistirDizi([1,2,3,4,5,6,7,8,9]).slice(0,n).sort((a,b)=>a-b); }
function startRound(){ current=TURLAR[idx]; current.bos=rastgeleBos(current.bos.length); filled=new Set(); busy=false; setAktif(); render(); }
function setAktif(){ aktif = current.bos.find(p=>!filled.has(p)); if(aktif===undefined) aktif=-1; }

function padsHTML(){
  return '<div class="pads">'+current.tam.map((v,i)=>{
    let inner, cls;
    if(!current.bos.includes(i)){ cls='verili'; inner=v; }
    else if(filled.has(i)){ cls='dolu'; inner=v; }
    else if(i===aktif){ cls='aktif'; inner='?'; }
    else { cls='bos'; inner='?'; }
    const arc = i>0 ? `<div class="arc">↷${current.et}</div>` : '';
    return arc+`<div class="pad ${cls}">${inner}</div>`;
  }).join('')+'</div>';
}

function render(msg){
  const dolan=current.bos.filter(p=>filled.has(p)).length;
  const secs = aktif>=0 ? secenekler(current.tam[aktif], current.say) : [];
  stage.innerHTML=`
    <div class="top"><span class="stars">⭐ ${score}</span></div>
    <div class="prog">Sıçrama ${idx+1}/${TOTAL} · Boşluk ${dolan}/${current.bos.length}</div>
    <div class="soru">${current.geri?"Geriye ":""}${current.baslik} — <b>?</b> yerlerini doldur</div>
    <div class="pond-wrap"><div class="frog">🐸</div>${padsHTML()}</div>
    <div class="opts">${secs.map(o=>`<button class="opt" onclick="cevap(${o},this)">${o}</button>`).join('')}</div>
    <div class="msg" id="msg">${msg||''}</div>`;
}

function cevap(v,btn){ if(busy||aktif<0) return;
  if(v===current.tam[aktif]){
    filled.add(aktif); if(window.sesDogru) sesDogru(); setAktif();
    if(aktif<0){ // tur bitti
      busy=true; score++; burstFx();
      const last=idx===TOTAL-1;
      setTimeout(()=>{ stage.innerHTML=`
        <div class="pond-wrap"><div class="frog">🐸✨</div>${padsHTML()}</div>
        <div class="msg ok" style="font-size:21px">Tüm boşlukları doldurdun! 🎉</div>
        <div class="think">${current.geri?"Geriye":"İleriye"} ${current.say}'${current.say===3||current.say===4?"er":(current.say===2?"şer":"ar")} sayarken her yaprakta ${current.geri?current.say+" çıkarırsın":current.say+" eklersin"}: ${current.tam.join(", ")}.</div>
        <button class="cta ${last?'sun ':''}big" onclick="${last?'bitir()':'ilerle()'}">${last?'Bitir 🏁':'Sonraki Sıçrama ➜'}</button>`; }, 500);
    } else render("Doğru! Sıradaki boşluk 🐸");
  } else { if(window.sesYanlis) sesYanlis(); btn.classList.add('wrong'); btn.classList.add('shake'); btn.disabled=true;
    const m=document.getElementById('msg'); m.className='msg no'; m.textContent="Ritmi tekrar say 🐸"; }
}
function ilerle(){ idx++; startRound(); }

function bitir(){ burstFx();
  stage.innerHTML=`
    <div class="heroes">🏆🐸🪷</div>
    <h1 class="start-title">Sıçrama Ustası!</h1>
    <p class="start-sub">2'şer, 3'er, 4'er, 5'er ve 10'ar saymayı, üstelik çok boşluklu dizilerde başardın!</p>
    <div class="think">İpucu: Ritmik sayma saatte, parada ve büyük sayıları sayarken hep işine yarar!</div>
    <button class="cta sun big" onclick="startGame()">Yeniden Oyna 🔁</button>`;
}

showStart();

/* === SES MOTORU === */
(function(){
  var sesAcik=true, actx=null, sonSes=0;
  function AC(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } } return actx; }
  function ton(f,st,du,tp,vol){ var a=AC(); if(!a) return; var o=a.createOscillator(), g=a.createGain();
    o.type=tp||'sine'; o.frequency.value=f; o.connect(g); g.connect(a.destination);
    var t=a.currentTime+st; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+du); o.start(t); o.stop(t+du+0.03); }
  function gate(){ var n=Date.now(); if(n-sonSes<120) return false; sonSes=n; return true; }
  window.sesDogru=function(){ if(!sesAcik||!gate()) return; [392,523,659,784,988,1319].forEach(function(f,i){ ton(f,i*0.05,0.12,'square',0.16); }); };
  window.sesYanlis=function(){ if(!sesAcik||!gate()) return; ton(300,0,0.16,'sawtooth',0.2); ton(200,0.15,0.22,'sawtooth',0.2); };
  window.sesToggle=function(){ sesAcik=!sesAcik; var b=document.getElementById('sesBtn'); if(b) b.textContent=sesAcik?'🔊':'🔇'; };
  function ekleBtn(){ if(document.getElementById('sesBtn')) return; var b=document.createElement('button'); b.id='sesBtn';
    b.textContent='🔊'; b.title='Ses aç/kapa'; b.setAttribute('onclick','sesToggle()');
    b.style.cssText='position:fixed;top:10px;right:10px;z-index:9999;border:none;cursor:pointer;font-size:20px;background:rgba(255,255,255,.9);border-radius:999px;width:42px;height:42px;box-shadow:0 3px 8px rgba(0,0,0,.25)';
    if(document.body) document.body.appendChild(b); }
  if(document.readyState!=='loading') ekleBtn(); else document.addEventListener('DOMContentLoaded',ekleBtn);
  function sar(name,ses){ if(typeof window[name]==='function'){ var o=window[name]; window[name]=function(){ ses(); return o.apply(this,arguments); }; return true; } return false; }
  sar('burstFx',window.sesDogru) || sar('starBurst',window.sesDogru);
})();

</script>
</body>
</html>
