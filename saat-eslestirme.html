<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saat Eşleştirme — 12 Saat & 24 Saat (3-4. Sınıf)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --dawn:#FF9F43; --dusk:#8B6BFF; --sky:#4EC5FF; --sun:#FFC531; --coral:#FF7A6B;
    --green:#4FCB77; --ink:#2a2f5a; --card:#ffffff; --soft:#EFEDFF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Nunito',system-ui,sans-serif;
    background:radial-gradient(1100px 720px at 25% -8%, #FFE7C9 0%, #D9CFFF 45%, #BFE3FF 100%);
    color:var(--ink); min-height:100vh; overflow-x:hidden;
    display:flex; align-items:center; justify-content:center; padding:14px;
  }
  h1,h2,h3{font-family:'Baloo 2',system-ui,sans-serif;}
  .stage{position:relative; z-index:2; width:100%; max-width:600px;
    background:var(--card); border-radius:28px; padding:20px 18px 24px;
    box-shadow:0 22px 54px rgba(50,40,110,.3), inset 0 0 0 4px #fff; animation:pop .4s cubic-bezier(.2,1.3,.4,1);}
  @keyframes pop{from{transform:translateY(18px) scale(.96); opacity:0}to{transform:none; opacity:1}}

  .rail{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .track{flex:1; height:14px; border-radius:20px; background:var(--soft); position:relative; overflow:hidden;}
  .fill{position:absolute; inset:0 auto 0 0; width:0%; border-radius:20px; background:linear-gradient(90deg,var(--dawn),var(--dusk)); transition:width .4s;}
  .scorebox{font-family:'Baloo 2'; font-weight:800; color:var(--dusk); font-size:16px; white-space:nowrap;}

  .gorev{text-align:center; font-family:'Baloo 2'; font-weight:800; font-size:20px; color:var(--ink); margin:4px 0 2px;}
  .gorev small{display:block; font-family:'Nunito'; font-weight:700; font-size:13px; color:#7a6fae; margin-top:2px;}

  .board{display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin-top:12px;}
  .kart{cursor:pointer; border:none; border-radius:14px; padding:16px 4px; text-align:center;
    font-family:'Baloo 2'; font-weight:800; font-size:21px; color:#22305a;
    background:#eef2fb; box-shadow:0 5px 0 #d5ddef; transition:.1s; letter-spacing:.5px;}
  .kart:active{transform:translateY(2px);}
  .kart.sec{background:var(--sun); color:#5a4200; box-shadow:0 5px 0 #d9a520, 0 0 0 3px #fff inset; transform:translateY(1px);}
  .kart.match{background:#e2f7ea; color:var(--green); box-shadow:0 5px 0 #b6e6c8; cursor:default; opacity:.85;}
  .kart.match::after{content:' ✓'; font-size:15px;}
  .kart.shake{animation:shk .4s;} @keyframes shk{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-6px)}}

  .feedback{margin-top:12px; text-align:center; font-family:'Baloo 2'; font-weight:800; font-size:18px; min-height:22px;}
  .feedback.ok{color:var(--green);} .feedback.no{color:var(--coral);}
  .think{background:var(--soft); border-radius:16px; padding:12px 14px; margin:14px 0 4px; font-weight:700; color:#5a4fa0; font-size:15px; text-align:center;}

  .cta{font-family:'Baloo 2'; font-weight:800; font-size:22px; color:#fff; border:none; cursor:pointer;
    background:var(--dusk); padding:14px 30px; border-radius:20px; box-shadow:0 6px 0 #6a4fd0; margin-top:6px;}
  .cta:active{transform:translateY(4px); box-shadow:0 2px 0 #6a4fd0;} .cta.big{display:block; margin:16px auto 0;}
  .cta.sun{background:var(--sun);color:#5a4200;box-shadow:0 6px 0 #d9a520}

  .burst{position:fixed; inset:0; pointer-events:none; z-index:9; overflow:hidden;}
  .burst span{position:absolute; top:40%; font-size:26px; animation:fly 1s ease-out forwards;}
  @keyframes fly{to{transform:translate(var(--tx),var(--ty)) rotate(var(--r)); opacity:0}}

  .start-title{font-size:30px; text-align:center; color:var(--ink); line-height:1.1; margin:6px 0;}
  .start-sub{text-align:center; font-weight:700; color:#6a5fa8; font-size:16px; margin-bottom:6px;}
  .heroes{font-size:52px; text-align:center; margin:4px 0;}
  @media (max-width:480px){ .board{grid-template-columns:repeat(3,1fr); gap:8px} .kart{font-size:19px; padding:14px 2px} .start-title{font-size:25px} }
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;}}
</style>
</head>
<body>
<div class="burst" id="burst"></div>
<div class="stage" id="stage"></div>

<script>
/* Her cift: 12 saatlik gosterim (a) ile 24 saatlik gosterim (b). Ayni saat.
   Kartlarda ogleden once/sonra yazmaz; cocuk cevriyi kendi yapar.
   Cogu ogleden sonra (+12): 3:20-15:20, 9:00-21:00 ... 2 sabah (ayni): 7:00-07:00. */
const CIFTLER = [
  ["1:00","13:00"], ["2:30","14:30"], ["3:20","15:20"], ["4:45","16:45"],
  ["5:15","17:15"], ["6:00","18:00"], ["8:00","20:00"], ["9:15","21:15"],
  ["10:45","22:45"], ["11:00","23:00"], ["7:00","19:00"], ["8:30","20:30"]
];

let kartlar=[], sel=null, matched=new Set(), sarsil=[], busy=false, kalan=0;
const stage=document.getElementById('stage'), burst=document.getElementById('burst');
const TOPLAM=CIFTLER.length;

function karistir(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function burstFx(){ const emo=["\u2b50","\ud83d\udd50","\ud83c\udf89","\u2728"]; let h='';
  for(let i=0;i<16;i++){ const tx=(Math.random()*2-1)*55+'vw', ty=(Math.random()*-1-0.2)*55+'vh', r=(Math.random()*720-360)+'deg';
    h+=`<span style="left:${40+Math.random()*20}%;--tx:${tx};--ty:${ty};--r:${r}">${emo[i%emo.length]}</span>`; }
  burst.innerHTML=h; setTimeout(()=>burst.innerHTML='',1000); }

function showStart(){
  stage.innerHTML=`
    <div class="heroes">\ud83d\udd50\ud83d\udd00</div>
    <h1 class="start-title">Saat Eşleştirme</h1>
    <p class="start-sub">Karışık tablodaki kartlarda aynı saatin <b>12 saatlik</b> ve <b>24 saatlik</b> gösterimi var. İkilileri bul ve eşleştir!</p>
    <div class="think">Öğleden sonra saatleri 24 saatlik gösterimde 12 fazladır: 3:20 → 15:20, 9:00 → 21:00.</div>
    <button class="cta sun big" onclick="startGame()">Başla ▶</button>`;
}
function startGame(){ kur(); }
function kur(){ kartlar=[]; CIFTLER.forEach((p,pid)=>{ kartlar.push({id:kartlar.length,pid,txt:p[0]}); kartlar.push({id:kartlar.length,pid,txt:p[1]}); });
  karistir(kartlar); matched=new Set(); sel=null; sarsil=[]; busy=false; kalan=TOPLAM; render(); }

function render(msg){
  const pct=Math.round(((TOPLAM-kalan)/TOPLAM)*100);
  const cells=kartlar.map(c=>{
    const cls = matched.has(c.id)?'match':((sel===c.id?'sec':'')+(sarsil.includes(c.id)?' shake':''));
    return `<button class="kart ${cls}" onclick="tik(${c.id})">${c.txt}</button>`;
  }).join('');
  stage.innerHTML=`
    <div class="rail"><div class="track"><div class="fill" style="width:${pct}%"></div></div>
      <span class="scorebox">\ud83d\udd50 ${TOPLAM-kalan}/${TOPLAM}</span></div>
    <div class="gorev">Aynı saati eşleştir<small>12 saatlik ↔ 24 saatlik gösterim</small></div>
    <div class="board">${cells}</div>
    <div class="feedback" id="fb">${msg||''}</div>`;
}

function tik(id){ if(busy) return; if(matched.has(id)) return;
  if(sel===null){ sel=id; render(); return; }
  if(sel===id){ sel=null; render(); return; }
  const s=kartlar.find(x=>x.id===sel), c=kartlar.find(x=>x.id===id);
  if(s.pid===c.pid){ matched.add(sel); matched.add(id); sel=null; kalan--;
    if(window.sesDogru) sesDogru();
    if(kalan===0){ busy=true; setTimeout(bitir,450); } else render("Doğru eşleşme! ✓");
  } else {
    if(window.sesYanlis) sesYanlis(); busy=true; sarsil=[sel,id]; render("Bu ikisi aynı saat değil \ud83d\udd50");
    setTimeout(()=>{ busy=false; sel=null; sarsil=[]; render(); }, 750);
  }
}

function bitir(){ burstFx();
  stage.innerHTML=`
    <div class="heroes">\ud83c\udfc6\ud83d\udd50</div>
    <h1 class="start-title">Hepsini Eşleştirdin!</h1>
    <p class="start-sub">Saatlerin 12 saatlik ve 24 saatlik gösterimlerini doğru eşleştirdin. Süper!</p>
    <div class="think">Kural: Öğleden sonra saatine <b>12 ekle</b> → 24 saatlik gösterim (4:45 → 16:45).</div>
    <button class="cta sun big" onclick="startGame()">Yeniden Karıştır 🔁</button>`;
}

showStart();

/* === SES MOTORU === */
(function(){
  var sesAcik=true, actx=null, sonSes=0;
  function AC(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } } return actx; }
  function ton(f,st,du,tp,vol){ var a=AC(); if(!a) return; var o=a.createOscillator(), g=a.createGain();
    o.type=tp||'sine'; o.frequency.value=f; o.connect(g); g.connect(a.destination);
    var t=a.currentTime+st; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+du); o.start(t); o.stop(t+du+0.03); }
  function gate(){ var n=Date.now(); if(n-sonSes<120) return false; sonSes=n; return true; }
  window.sesDogru=function(){ if(!sesAcik||!gate()) return; [392,523,659,784,988,1319].forEach(function(f,i){ ton(f,i*0.05,0.12,'square',0.16); }); };
  window.sesYanlis=function(){ if(!sesAcik||!gate()) return; ton(300,0,0.16,'sawtooth',0.2); ton(200,0.15,0.22,'sawtooth',0.2); };
  window.sesToggle=function(){ sesAcik=!sesAcik; var b=document.getElementById('sesBtn'); if(b) b.textContent=sesAcik?'\ud83d\udd0a':'\ud83d\udd07'; };
  function ekleBtn(){ if(document.getElementById('sesBtn')) return; var b=document.createElement('button'); b.id='sesBtn';
    b.textContent='\ud83d\udd0a'; b.title='Ses ac/kapa'; b.setAttribute('onclick','sesToggle()');
    b.style.cssText='position:fixed;top:10px;right:10px;z-index:9999;border:none;cursor:pointer;font-size:20px;background:rgba(255,255,255,.9);border-radius:999px;width:42px;height:42px;box-shadow:0 3px 8px rgba(0,0,0,.25)';
    if(document.body) document.body.appendChild(b); }
  if(document.readyState!=='loading') ekleBtn(); else document.addEventListener('DOMContentLoaded',ekleBtn);
  function sar(name,ses){ if(typeof window[name]==='function'){ var o=window[name]; window[name]=function(){ ses(); return o.apply(this,arguments); }; return true; } return false; }
  sar('burstFx',window.sesDogru) || sar('starBurst',window.sesDogru);
})();

</script>
</body>
</html>
