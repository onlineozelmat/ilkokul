<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aklından Sayı Tut — İşlem Sihri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#9B6BFF; --gold:#FFD24A; --pink:#FF6BC4; --aqua:#38D0E0;
    --green:#5FCB77; --coral:#FF7A6B; --ink:#2a1a55; --card:#ffffff; --soft:#efeaff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Nunito',system-ui,sans-serif;
    background:radial-gradient(1100px 740px at 28% -8%, #4a2c8f 0%, #33206e 42%, #1c1140 100%);
    color:var(--ink); min-height:100vh; overflow-x:hidden;
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  h1,h2,h3,.display{font-family:'Baloo 2',system-ui,sans-serif;}

  .sky{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
  .sky i{position:absolute; font-size:20px; opacity:.18; animation:tw 3s infinite ease-in-out;}
  @keyframes tw{0%,100%{opacity:.15; transform:scale(.7)}50%{opacity:.9; transform:scale(1.1)}}

  .stage{position:relative; z-index:2; width:100%; max-width:600px;
    background:var(--card); border-radius:32px; padding:26px 24px 30px;
    box-shadow:0 24px 60px rgba(10,4,40,.6), inset 0 0 0 4px #fff;
    animation:pop .45s cubic-bezier(.2,1.3,.4,1);}
  @keyframes pop{from{transform:translateY(24px) scale(.94); opacity:0}to{transform:none; opacity:1}}

  .rail{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .back{font-family:'Baloo 2'; font-weight:800; font-size:14px; cursor:pointer; border:none;
    background:var(--soft); color:#5a3fb0; padding:6px 14px; border-radius:999px;}
  .track{flex:1; height:14px; border-radius:20px; background:var(--soft); position:relative; overflow:hidden;}
  .fill{position:absolute; inset:0 auto 0 0; width:0%; border-radius:20px;
    background:linear-gradient(90deg,var(--aqua),var(--purple),var(--gold)); transition:width .4s;}
  .scorebox{font-family:'Baloo 2'; font-weight:800; color:var(--purple); font-size:17px; white-space:nowrap;}

  .scene-emoji{font-size:56px; text-align:center; line-height:1; margin:2px 0 6px; animation:bob 2.6s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
  .story{font-size:19px; line-height:1.5; font-weight:700; color:var(--ink); margin-bottom:6px; text-align:center;}
  .story b{color:var(--purple);}

  .curval{background:var(--soft); border-radius:16px; padding:10px 16px; text-align:center; margin:10px auto; max-width:340px;
    font-weight:800; color:#5a3fb0; font-size:17px;}
  .curval .big{font-family:'Baloo 2'; font-size:30px; color:var(--purple);}
  .question{font-family:'Baloo 2'; font-weight:700; font-size:23px; color:var(--ink); margin:10px 0 12px; text-align:center;}

  .padwrap{display:flex; flex-direction:column; align-items:center; gap:12px;}
  .display-num{font-family:'Baloo 2'; font-weight:800; font-size:42px; color:var(--ink);
    background:var(--soft); min-width:150px; text-align:center; padding:8px 24px; border-radius:20px; letter-spacing:2px;}
  .pad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:100%; max-width:300px;}
  .key{font-family:'Baloo 2'; font-weight:700; font-size:26px; padding:14px 0; border:none; cursor:pointer;
    border-radius:16px; background:#fff; color:var(--ink); box-shadow:0 4px 0 #ddd3ff, inset 0 0 0 2px #efeaff;}
  .key:active{transform:translateY(3px); box-shadow:0 1px 0 #ddd3ff, inset 0 0 0 2px #efeaff;}
  .key.act{background:var(--purple); box-shadow:0 4px 0 #6f4fd6; color:#fff;}
  .key.go{background:var(--gold); box-shadow:0 4px 0 #d9a520; color:#5a4200;}

  .cta{font-family:'Baloo 2'; font-weight:800; font-size:21px; color:#fff; border:none; cursor:pointer;
    background:var(--purple); padding:14px 28px; border-radius:20px; box-shadow:0 6px 0 #6f4fd6; margin:6px 4px 0;}
  .cta:active{transform:translateY(4px); box-shadow:0 2px 0 #6f4fd6;} .cta.big{display:block; margin:20px auto 0;}
  .cta.gold{background:var(--gold); color:#5a4200; box-shadow:0 6px 0 #d9a520;} .cta.gold:active{box-shadow:0 2px 0 #d9a520;}

  .trickbtn{display:flex; align-items:center; gap:14px; width:100%; text-align:left; cursor:pointer; border:none;
    background:var(--soft); border-radius:20px; padding:16px 18px; margin:10px 0; box-shadow:0 5px 0 #ddd3ff; transition:.12s;}
  .trickbtn:active{transform:translateY(3px); box-shadow:0 2px 0 #ddd3ff;}
  .trickbtn .ic{font-size:34px;} .trickbtn .tx{flex:1;}
  .trickbtn .tt{font-family:'Baloo 2'; font-weight:800; font-size:20px; color:var(--ink);}
  .trickbtn .ts{font-weight:700; font-size:14px; color:#7a6fae;}
  .trickbtn .go{font-family:'Baloo 2'; font-weight:800; color:#fff; background:var(--purple); padding:6px 14px; border-radius:999px; font-size:14px;}

  .feedback{margin-top:14px; text-align:center; font-family:'Baloo 2'; font-weight:800; font-size:21px; min-height:26px;}
  .feedback.ok{color:var(--green);} .feedback.no{color:var(--coral);} .feedback.hint{color:var(--purple);}
  .hintline{text-align:center; color:#8a7fc0; font-weight:700; margin-top:8px; font-size:15px;}
  .think{background:var(--soft); border-radius:18px; padding:14px 16px; margin:14px 0 6px;
    font-weight:700; color:#5a3fb0; font-size:17px; display:flex; gap:10px; align-items:flex-start;}
  .think::before{content:"🪄"; font-size:20px;}
  .shake{animation:shk .4s;} @keyframes shk{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(6px)}50%{transform:translateX(-8px)}}

  .burst{position:fixed; inset:0; pointer-events:none; z-index:9; overflow:hidden;}
  .burst span{position:absolute; top:40%; font-size:26px; animation:fly 1.1s ease-out forwards;}
  @keyframes fly{to{transform:translate(var(--tx),var(--ty)) rotate(var(--r)); opacity:0}}

  .reveal-num{font-family:'Baloo 2'; font-weight:800; font-size:80px; color:var(--gold); text-align:center;
    text-shadow:0 4px 0 #d9a520; animation:pump .6s cubic-bezier(.2,1.5,.4,1);}
  @keyframes pump{0%{transform:scale(0)}60%{transform:scale(1.3)}100%{transform:scale(1)}}

  .start-title{font-size:36px; text-align:center; color:var(--ink); line-height:1.1; margin:6px 0;}
  .start-sub{text-align:center; font-weight:700; color:#6a5aa8; font-size:17px; margin-bottom:6px;}
  .heroes{font-size:60px; text-align:center; margin:6px 0;}

  @media (max-width:480px){ .story{font-size:17px} .question{font-size:19px} .start-title{font-size:28px}
    .reveal-num{font-size:64px} }
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;}}
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<div class="burst" id="burst"></div>
<div class="stage" id="stage"></div>

<script>
/* =========================================================================
   3 SİHİR (aklından sayı tut). Her adım: {label, f:(c,n)=>yeni değer}
   c = elindeki değer, n = ilk tutulan sayı.
   ========================================================================= */
const SIHIRLER = [
  { id:1, ad:"1. Sihir", ic:"🔮", altbilgi:"4 adım · toplama ve bölme", sonuc:8,
    adimlar:[
      { label:"Tuttuğun sayının bir SONRAKİ sayısını ekle (yani 1 fazlasını)", f:(c,n)=>c+(n+1) },
      { label:"Şimdi 15 ekle", f:c=>c+15 },
      { label:"Sonucu 2'ye böl", f:c=>c/2 },
      { label:"İlk tuttuğun sayıyı çıkar", f:(c,n)=>c-n }
    ],
    neden:"Sonunda tuttuğun sayıyı geri çıkardın ve o “yok oldu”. Geriye kalan (1+15)'in yarısı = 8. Hangi sayıyı seçersen seç, sonuç hep 8!" },

  { id:2, ad:"2. Sihir", ic:"🎩", altbilgi:"7 adım · dört işlem birden", sonuc:1,
    adimlar:[
      { label:"Tuttuğun sayıyı 4 ile çarp", f:c=>c*4 },
      { label:"18 ekle", f:c=>c+18 },
      { label:"2'ye böl", f:c=>c/2 },
      { label:"7 çıkar", f:c=>c-7 },
      { label:"3 ile çarp", f:c=>c*3 },
      { label:"6'ya böl", f:c=>c/6 },
      { label:"İlk tuttuğun sayıyı çıkar", f:(c,n)=>c-n }
    ],
    neden:"Çarpma ve bölmeler tuttuğun sayıyı bir turdan geçirip aynen geri getirdi; sonunda onu çıkarınca yok oldu. Geriye hep 1 kalıyor!" },

  { id:3, ad:"3. Sihir", ic:"✨", altbilgi:"4 adım · en kısası", sonuc:5,
    adimlar:[
      { label:"Tuttuğun sayıyı 2 ile çarp", f:c=>c*2 },
      { label:"10 ekle", f:c=>c+10 },
      { label:"2'ye böl", f:c=>c/2 },
      { label:"İlk tuttuğun sayıyı çıkar", f:(c,n)=>c-n }
    ],
    neden:"2 ile çarpıp sonra 2'ye bölünce sayı geri geldi; 10'un yarısı 5 oldu; tuttuğun sayıyı çıkarınca o yok oldu. Sonuç hep 5!" },

  { id:4, ad:"4. Sihir", ic:"🌟", altbilgi:"8 adım · en karmaşığı", sonuc:9,
    adimlar:[
      { label:"Tuttuğun sayıyı 3 ile çarp", f:c=>c*3 },
      { label:"18 ekle", f:c=>c+18 },
      { label:"Sonucu 3'e böl", f:c=>c/3 },
      { label:"5 ekle", f:c=>c+5 },
      { label:"2 ile çarp", f:c=>c*2 },
      { label:"4 çıkar", f:c=>c-4 },
      { label:"2'ye böl", f:c=>c/2 },
      { label:"İlk tuttuğun sayıyı çıkar", f:(c,n)=>c-n }
    ],
    neden:"Çarpma ve bölme adımları tuttuğun sayıyı tur attırıp aynen geri getirdi. Eklediğin ve çıkardığın sabit sayılar sonunda 9'a denk geldi. En sonda tuttuğun sayıyı çıkarınca o yok oldu — sonuç hep 9!" },

  { id:5, ad:"5. Sihir", ic:"🎲", altbilgi:"5 adım · dört işlem birden", sonuc:3,
    adimlar:[
      { label:"Tuttuğun sayıya 5 ekle", f:c=>c+5 },
      { label:"Sonucu 2 ile çarp", f:c=>c*2 },
      { label:"4 çıkar", f:c=>c-4 },
      { label:"2'ye böl", f:c=>c/2 },
      { label:"İlk tuttuğun sayıyı çıkar", f:(c,n)=>c-n }
    ],
    neden:"5 ekleyip 2 ile çarptın, sonra 4 çıkarıp 2'ye böldün; sayı kendine döndü. Geriye hep 3 kaldı!" },
];

let view='menu', trick=null, n=0, cur=0, step=0, typedNum='', enteringStart=false;
const stage=document.getElementById('stage'), burst=document.getElementById('burst');

(function(){ const em=["⭐","✨","🔮","🪄","🎩","💫","🌟","♠️"]; let s='';
  for(let i=0;i<50;i++){s+=`<i style="left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s">${em[i%em.length]}</i>`;}
  document.getElementById('sky').innerHTML=s; })();

function burstFx(set){ const emo=set||["✨","⭐","🎉","🪄","💫"]; let h='';
  for(let i=0;i<22;i++){ const tx=(Math.random()*2-1)*60+'vw', ty=(Math.random()*-1-0.2)*60+'vh', r=(Math.random()*720-360)+'deg';
    h+=`<span style="left:${40+Math.random()*20}%;--tx:${tx};--ty:${ty};--r:${r}">${emo[i%emo.length]}</span>`; }
  burst.innerHTML=h; setTimeout(()=>burst.innerHTML='',1100); }

/* ---------- MENÜ ---------- */
function showMenu(){
  view='menu';
  const btns=SIHIRLER.map((t,i)=>`
    <button class="trickbtn" onclick="startTrick(${i})">
      <div class="ic">${t.ic}</div>
      <div class="tx"><div class="tt">${t.ad}</div><div class="ts">${t.altbilgi}</div></div>
      <div class="go">OYNA ▶</div>
    </button>`).join('');
  stage.innerHTML=`
    <div class="heroes">🧙✨</div>
    <h1 class="start-title">Aklından Sayı Tut</h1>
    <p class="start-sub">Bir sayı tut, işlemleri sen yap… ben sonucu bileceğim! Bir sihir seç ve başla. 🔮</p>
    <div style="margin-top:10px">${btns}</div>`;
}

/* ---------- SAYI TUTMA (başlangıç) ---------- */
function startTrick(i){ trick=SIHIRLER[i]; view='start';
  stage.innerHTML=`
    <div class="rail"><button class="back" onclick="showMenu()">↩ Menü</button>
      <div class="track"><div class="fill" style="width:0%"></div></div>
      <span class="scorebox">${trick.ic} ${trick.ad}</span></div>
    <div class="scene-emoji">🔮</div>
    <div class="story"><b>Aklından bir sayı tut.</b><br>Kimseye söyleme, sadece aklında kalsın. Sonra adımları tek tek birlikte yapacağız… hazır mısın? 🔮</div>
    <button class="cta gold big" onclick="baslat()">Tuttum, başla ▶</button>`;
}

function padHTML(goFn){
  return `<div class="pad">
    ${[1,2,3,4,5,6,7,8,9].map(k=>`<button class="key" onclick="press(${k})">${k}</button>`).join('')}
    <button class="key act" onclick="press('del')">⌫</button>
    <button class="key" onclick="press(0)">0</button>
    <button class="key go" onclick="${goFn}()">✓</button></div>`;
}
function press(k){ const d=document.getElementById('disp');
  if(k==='del') typedNum=typedNum.slice(0,-1); else if(typedNum.length<4) typedNum+=k;
  d.textContent=typedNum===''?'0':typedNum; }

function baslat(){ step=0; view='step'; renderStep(); }

/* ---------- ADIMLAR ---------- */
function renderStep(){
  const a=trick.adimlar[step]; const pct=Math.round((step/trick.adimlar.length)*100);
  const sonAdim = step===trick.adimlar.length-1;
  stage.innerHTML=`
    <div class="rail"><button class="back" onclick="showMenu()">↩ Menü</button>
      <div class="track"><div class="fill" style="width:${pct}%"></div></div>
      <span class="scorebox">Adım ${step+1}/${trick.adimlar.length}</span></div>
    <div class="scene-emoji">🪄</div>
    <div class="story" style="font-size:16px;color:#7a6fae">Bunu aklından (ya da kâğıtta) yap:</div>
    <div class="question">${a.label}</div>
    <button class="cta ${sonAdim?'gold ':''}big" onclick="ileri()">${sonAdim?'Sonucu Aç 🔮':'İleri ➜'}</button>`;
}
function ileri(){ step++; if(step<trick.adimlar.length) renderStep(); else reveal(); }

function kontrol(){ if(typedNum==='') return;
  const v=parseInt(typedNum,10);
  const beklenen=trick.adimlar[step].f(cur,n);
  const fb=document.getElementById('fb');
  if(v===beklenen){
    cur=beklenen; step++; burstFx(["✨"]);
    if(step<trick.adimlar.length) renderStep(); else reveal();
  } else {
    fb.className='feedback hint';
    fb.textContent = v<beklenen ? "Biraz düşük, tekrar dene ⬆" : "Biraz yüksek, tekrar dene ⬇";
    typedNum=''; document.getElementById('disp').textContent='0';
  }
}

/* ---------- BÜYÜK AÇIKLAMA ---------- */
function reveal(){ burstFx(["✨","⭐","🎉","🪄","💫","🌟"]); view='reveal';
  stage.innerHTML=`
    <div class="scene-emoji">🎩✨</div>
    <div class="story">İşte sihir! Hangi sayıyı tuttuysan tut…</div>
    <div class="reveal-num">${trick.sonuc}</div>
    <div class="story"><b>Sonuç ${trick.sonuc}!</b> 🔮</div>
    <div class="think" style="background:#fff3d6;color:#a86a12">Şimdi <b>başka bir sayı</b> tutup aynı sihri tekrar dene. Bu sefer ne çıkacak dersin? Birkaç sayı dene, bir şey fark edecek misin? 🤔</div>
    <div style="text-align:center;margin-top:8px">
      <button class="cta gold" onclick="startTrick(${trick.id-1})">Aynı sihir, başka sayı 🔁</button>
      <button class="cta" onclick="showMenu()">Başka sihir ▶</button>
    </div>
    <div style="text-align:center;margin-top:6px">
      <button class="cta" style="background:var(--aqua);box-shadow:0 6px 0 #1fa8b8;font-size:16px" onclick="document.getElementById('sir').style.display='block';this.style.display='none'">🔍 Sırrı göster</button>
    </div>
    <div id="sir" style="display:none"><div class="think">${trick.neden}</div></div>`;
}

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){ if(view==='start') baslat(); else if(view==='step') ileri(); } });

showMenu();

/* === SES MOTORU (power-up doğru / buzzer yanlış) === */
(function(){
  var sesAcik=true, actx=null, sonSes=0;
  function AC(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } } return actx; }
  function ton(f,st,du,tp,vol){ var a=AC(); if(!a) return; var o=a.createOscillator(), g=a.createGain();
    o.type=tp||'sine'; o.frequency.value=f; o.connect(g); g.connect(a.destination);
    var t=a.currentTime+st; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+du); o.start(t); o.stop(t+du+0.03); }
  function gate(){ var n=Date.now(); if(n-sonSes<120) return false; sonSes=n; return true; }
  window.sesDogru=function(){ if(!sesAcik||!gate()) return; [392,523,659,784,988,1319].forEach(function(f,i){ ton(f,i*0.05,0.12,'square',0.16); }); };
  window.sesYanlis=function(){ if(!sesAcik||!gate()) return; ton(300,0,0.16,'sawtooth',0.2); ton(200,0.15,0.22,'sawtooth',0.2); };
  window.sesToggle=function(){ sesAcik=!sesAcik; var b=document.getElementById('sesBtn'); if(b) b.textContent=sesAcik?'🔊':'🔇'; };
  function ekleBtn(){ if(document.getElementById('sesBtn')) return; var b=document.createElement('button'); b.id='sesBtn';
    b.textContent='🔊'; b.title='Ses aç/kapa'; b.setAttribute('onclick','sesToggle()');
    b.style.cssText='position:fixed;top:10px;right:10px;z-index:9999;border:none;cursor:pointer;font-size:20px;background:rgba(255,255,255,.9);border-radius:999px;width:42px;height:42px;box-shadow:0 3px 8px rgba(0,0,0,.25)';
    if(document.body) document.body.appendChild(b); }
  if(document.readyState!=='loading') ekleBtn(); else document.addEventListener('DOMContentLoaded',ekleBtn);
  function sar(name,ses){ if(typeof window[name]==='function'){ var o=window[name]; window[name]=function(){ ses(); return o.apply(this,arguments); }; return true; } return false; }
  sar('burstFx',window.sesDogru) || sar('starBurst',window.sesDogru);
  sar('wrong',window.sesYanlis); sar('yanlis',window.sesYanlis);
})();

</script>
</body>
</html>
