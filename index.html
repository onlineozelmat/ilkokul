<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matematik Oyun Merkezi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --space1:#1a1246; --space2:#2a1a5e;
    --star:#FFD93D; --coral:#FF6B6B; --teal:#4ECDC4;
    --purple:#B388FF; --green:#6BCB77; --ink:#241a52;
    --card:#ffffff; --soft:#f2edff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Nunito',system-ui,sans-serif;
    background:radial-gradient(1200px 800px at 20% -5%, #3d2478 0%, var(--space2) 42%, var(--space1) 100%);
    color:var(--ink); min-height:100vh; overflow-x:hidden; padding:0 0 60px;
  }
  h1,h2,h3,.display{font-family:'Baloo 2',system-ui,sans-serif;}
  .sky{position:fixed; inset:0; z-index:0; pointer-events:none;}
  .sky i{position:absolute; width:3px; height:3px; border-radius:50%; background:#fff; opacity:.7; animation:tw 3s infinite ease-in-out;}
  @keyframes tw{0%,100%{opacity:.2; transform:scale(.6)}50%{opacity:1; transform:scale(1.2)}}

  .wrap{position:relative; z-index:2; max-width:1000px; margin:0 auto; padding:0 20px;}

  header{text-align:center; padding:48px 10px 30px;}
  .logo{font-size:58px; line-height:1; animation:bob 3s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  header h1{color:#fff; font-size:clamp(34px,6vw,54px); margin-top:6px; text-shadow:0 4px 0 rgba(0,0,0,.25);}
  header p{color:#d9ccff; font-weight:700; font-size:clamp(15px,2.6vw,19px); margin-top:8px;}
  .growbadge{display:inline-block; margin-top:16px; background:rgba(255,255,255,.12); color:#fff;
    font-family:'Baloo 2'; font-weight:700; font-size:15px; padding:6px 18px; border-radius:999px; border:2px dashed rgba(255,255,255,.35);}

  /* filtre (sadece 3+ oyun olunca görünür) */
  .filters{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin:6px 0 26px;}
  .chip-f{font-family:'Baloo 2'; font-weight:700; font-size:15px; cursor:pointer; border:none;
    padding:8px 18px; border-radius:999px; background:rgba(255,255,255,.15); color:#fff; transition:.15s;}
  .chip-f.active{background:var(--star); color:var(--ink);}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:22px;}

  .game{background:var(--card); border-radius:26px; overflow:hidden; box-shadow:0 18px 40px rgba(10,4,40,.45);
    display:flex; flex-direction:column; transition:transform .18s, box-shadow .18s;}
  .game:hover{transform:translateY(-6px); box-shadow:0 26px 52px rgba(10,4,40,.55);}
  .thumb{height:110px; display:flex; align-items:center; justify-content:center; font-size:58px;
    background:linear-gradient(135deg,var(--purple),var(--teal));}
  .game .body{padding:18px 18px 20px; display:flex; flex-direction:column; flex:1;}
  .game h3{font-size:22px; color:var(--ink); margin-bottom:4px;}
  .badges{display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 10px;}
  .badge{font-family:'Baloo 2'; font-weight:700; font-size:12px; padding:3px 10px; border-radius:999px;}
  .badge.sinif{background:var(--star); color:var(--ink);}
  .badge.konu{background:var(--soft); color:#5a3fb0;}
  .game .desc{font-weight:700; color:#6a5e8f; font-size:15px; line-height:1.4; flex:1; margin-bottom:14px;}
  .play{display:block; text-align:center; text-decoration:none; font-family:'Baloo 2'; font-weight:800; font-size:19px;
    color:#fff; background:var(--green); padding:12px; border-radius:16px; box-shadow:0 5px 0 #3f9e4c; transition:.12s;}
  .play:hover{filter:brightness(1.05);} .play:active{transform:translateY(4px); box-shadow:0 1px 0 #3f9e4c;}

  /* yakında kartları */
  .soon{background:rgba(255,255,255,.06); border:3px dashed rgba(255,255,255,.28); border-radius:26px;
    min-height:270px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:#cfc2ff;}
  .soon .e{font-size:46px; opacity:.8; animation:bob 3.4s ease-in-out infinite;}
  .soon span{font-family:'Baloo 2'; font-weight:700; font-size:18px;}

  footer{text-align:center; color:#a99cd8; font-weight:700; font-size:14px; margin-top:40px; line-height:1.6;}

  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;}}
</style>
</head>
<body>
<div class="sky" id="sky"></div>

<div class="wrap">
  <header>
    <div class="logo">🚀🪐✨</div>
    <h1>Matematik Oyun Merkezi</h1>
    <p>Hikâye içinde matematik yapan, düşündüren, eğlenceli oyunlar</p>
    <div class="growbadge">🛸 Yeni oyunlar ekleniyor</div>
  </header>

  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>

  <footer>
    Sınıfta oynatmak için bir oyuna tıkla · Tüm oyunlar tarayıcıda, kurulumsuz açılır<br>
    <span style="opacity:.7">Yeni oyun eklemek için: kodun içindeki OYUNLAR listesine tek satır ekle.</span>
  </footer>
</div>

<script>
/* =========================================================================
   OYUNLAR LİSTESİ — yeni oyun eklemek için buraya tek bir nesne ekle.
   dosya  : oyunun .html adı (bu index.html ile AYNI klasörde olmalı)
   sinif  : "2. Sınıf" gibi
   konular: kart üzerinde görünen etiketler (istediğin kadar)
   ========================================================================= */
const OYUNLAR = [
  {
    baslik:"Yıldız Tozu Görevi",
    emoji:"🚀",
    sinif:"2. Sınıf",
    konular:["Toplama","Çıkarma","Ritmik Sayma"],
    aciklama:"Astronot Deniz'le uzay yolculuğu. Her matematik sorusu roketi ileri götürür!",
    dosya:"yildiz-tozu-gorevi.html"
  },
  {
    baslik:"Deniz'in Market Görevi",
    emoji:"🛒",
    sinif:"2. Sınıf",
    konular:["Para","Para Üstü","Toplama"],
    aciklama:"Deniz'le markette alışveriş. Fiyatları topla, para üstü hesapla, bütçeni yönet!",
    dosya:"para-market-gorevi.html"
  },
  {
    baslik:"Sayı Dedektifi",
    emoji:"🕵️",
    sinif:"3. Sınıf",
    konular:["Deneme-Yanılma","Çarpma","Bölme"],
    aciklama:"Kilitleri kır, şifreleri çöz! Dene, ipucu al, tekrar dene. Deneme-yanılmayla matematik.",
    dosya:"sayi-dedektifi.html"
  },
  {
    baslik:"Şekil Ustası",
    emoji:"📐",
    sinif:"3. Sınıf",
    konular:["Geometri","Şekiller","Çevre"],
    aciklama:"Kenar say, köşe bul, simetriyi keşfet, çevreyi hesapla. Gerçek şekillerle geometri!",
    dosya:"geometri-sekil-ustasi.html"
  },
  {
    baslik:"Zamanın Kayıp Adası",
    emoji:"🗺️",
    sinif:"4. Sınıf",
    konular:["İşlemler","Kesirler","Problem","Geometri"],
    aciklama:"Harita üstünde beş bölge, beş kristal! İşlem, kesir, problem ve geometriyle zamanı kurtar.",
    dosya:"zamanin-kayip-adasi.html"
  }
  // ,{ baslik:"...", emoji:"🕐", sinif:"2. Sınıf", konular:["Saat"], aciklama:"...", dosya:"besinci-oyun.html" }
];

/* yıldızlı gökyüzü */
(function(){
  let s=''; for(let i=0;i<70;i++){s+=`<i style="left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s"></i>`;}
  document.getElementById('sky').innerHTML=s;
})();

const grid=document.getElementById('grid');
const filterBar=document.getElementById('filters');
let aktifKonu="Hepsi";

function kart(o){
  return `<div class="game" data-konular="${o.konular.join('|')}">
    <div class="thumb">${o.emoji}</div>
    <div class="body">
      <h3>${o.baslik}</h3>
      <div class="badges">
        <span class="badge sinif">${o.sinif}</span>
        ${o.konular.map(k=>`<span class="badge konu">${k}</span>`).join('')}
      </div>
      <div class="desc">${o.aciklama}</div>
      <a class="play" href="${o.dosya}">Oyna ▶</a>
    </div>
  </div>`;
}

function soonKart(){
  return `<div class="soon"><div class="e">🛸</div><span>Yeni oyun yolda…</span></div>`;
}

function render(){
  const gorunen = OYUNLAR.filter(o => aktifKonu==="Hepsi" || o.konular.includes(aktifKonu));
  let html = gorunen.map(kart).join('');
  // grid boş kalmasın diye: en az 3 kutu olacak şekilde "yakında" ekle
  const bosluk = Math.max(0, 3 - gorunen.length);
  for(let i=0;i<bosluk;i++) html += soonKart();
  grid.innerHTML = html;
}

/* filtre çubuğu sadece 3+ oyun olunca anlamlı — o zaman görünür */
function buildFilters(){
  if(OYUNLAR.length < 3){ filterBar.style.display='none'; return; }
  const konular = ["Hepsi", ...new Set(OYUNLAR.flatMap(o=>o.konular))];
  filterBar.innerHTML = konular.map(k=>
    `<button class="chip-f${k===aktifKonu?' active':''}" onclick="setFilter('${k}')">${k}</button>`).join('');
}
function setFilter(k){ aktifKonu=k; buildFilters(); render(); }

buildFilters();
render();
</script>
</body>
</html>
