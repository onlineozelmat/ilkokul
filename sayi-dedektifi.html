<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sayı Dedektifi — Deneme-Yanılma Oyunu (3. Sınıf)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cyan:#25CFCF; --lime:#8BE04E; --magenta:#FF5C9E; --amber:#FFC531; --purple:#8B6BFF;
    --green:#5FCB77; --red:#FF6B6B; --ink:#221a4a; --card:#ffffff; --soft:#efeaff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Nunito',system-ui,sans-serif;
    background:radial-gradient(1100px 720px at 22% -5%, #34246e 0%, #241a52 42%, #10102f 100%);
    color:var(--ink); min-height:100vh; overflow-x:hidden;
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  h1,h2,h3,.display{font-family:'Baloo 2',system-ui,sans-serif;}

  .sky{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
  .sky i{position:absolute; font-size:24px; opacity:.14; animation:drift 10s linear infinite;}
  @keyframes drift{from{transform:translateY(15px) rotate(-8deg)}to{transform:translateY(-35px) rotate(8deg)}}

  .stage{position:relative; z-index:2; width:100%; max-width:640px;
    background:var(--card); border-radius:32px; padding:26px 24px 30px;
    box-shadow:0 24px 60px rgba(8,4,30,.6), inset 0 0 0 4px #fff;
    animation:pop .45s cubic-bezier(.2,1.3,.4,1);}
  @keyframes pop{from{transform:translateY(24px) scale(.94); opacity:0}to{transform:none; opacity:1}}

  .rail{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
  .track{flex:1; height:16px; border-radius:20px; background:var(--soft); position:relative; overflow:hidden;}
  .fill{position:absolute; inset:0 auto 0 0; width:0%; border-radius:20px;
    background:linear-gradient(90deg,var(--cyan),var(--purple),var(--magenta)); transition:width .5s cubic-bezier(.2,1,.4,1);}
  .badgemini{font-size:24px;}
  .scorebox{font-family:'Baloo 2'; font-weight:800; color:var(--purple); font-size:20px; white-space:nowrap;}

  .stage-tag{display:inline-block; font-family:'Baloo 2'; font-weight:700; font-size:14px;
    color:#fff; background:var(--purple); padding:4px 14px; border-radius:999px; margin-bottom:8px;}
  .scene-emoji{font-size:58px; text-align:center; line-height:1; margin:2px 0 6px; animation:bob 2.4s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .story{font-size:20px; line-height:1.5; font-weight:700; color:var(--ink); margin-bottom:6px;}
  .story b{color:var(--magenta);}

  /* ipucu kartları (dedektif) */
  .clues{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin:14px 0 4px;}
  .clue{background:var(--soft); border-radius:16px; padding:10px 16px; font-weight:800; color:#5a3fb0; font-size:16px;
    box-shadow:0 4px 0 #ddd3ff; display:flex; gap:8px; align-items:center;}
  .clue .k{font-size:20px;}

  /* deneme sayacı */
  .tries{display:inline-block; background:var(--amber); color:#5a4318; font-family:'Baloo 2'; font-weight:800;
    font-size:15px; padding:4px 14px; border-radius:999px; margin:2px auto 0;}

  .think{background:var(--soft); border-radius:18px; padding:12px 16px; margin:14px 0 6px;
    font-weight:700; color:#5a3fb0; font-size:17px; display:flex; gap:10px; align-items:flex-start;}
  .think::before{content:"🕵️"; font-size:20px;}
  .question{font-family:'Baloo 2'; font-weight:700; font-size:23px; color:var(--ink); margin:14px 0 12px; text-align:center;}

  .padwrap{display:flex; flex-direction:column; align-items:center; gap:12px;}
  .display-num{font-family:'Baloo 2'; font-weight:800; font-size:44px; color:var(--ink);
    background:var(--soft); min-width:150px; text-align:center; padding:8px 24px; border-radius:20px; letter-spacing:2px;}
  .pad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:100%; max-width:300px;}
  .key{font-family:'Baloo 2'; font-weight:700; font-size:26px; padding:14px 0; border:none; cursor:pointer;
    border-radius:16px; background:#fff; color:var(--ink); box-shadow:0 4px 0 #ddd3ff, inset 0 0 0 2px #efeaff;}
  .key:active{transform:translateY(3px); box-shadow:0 1px 0 #ddd3ff, inset 0 0 0 2px #efeaff;}
  .key.act{background:var(--cyan); box-shadow:0 4px 0 #17a3a3; color:#fff;}
  .key.go{background:var(--green); box-shadow:0 4px 0 #3f9e4c; color:#fff;}

  /* taş/kutu seçimi (alt küme) */
  .tiles{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin:6px 0;}
  .tile{font-family:'Baloo 2'; font-weight:800; font-size:24px; color:var(--ink); cursor:pointer; border:none;
    width:74px; height:74px; border-radius:20px; background:#fff; box-shadow:0 5px 0 #ddd3ff, inset 0 0 0 3px #efeaff; transition:.12s;}
  .tile.on{background:var(--lime); color:#2e4a17; box-shadow:0 5px 0 #5fa82f, inset 0 0 0 3px #a6ec74; transform:translateY(2px);}
  .tile:active{transform:translateY(4px);}

  .cta{font-family:'Baloo 2'; font-weight:800; font-size:22px; color:#fff; border:none; cursor:pointer;
    background:var(--green); padding:14px 34px; border-radius:20px; box-shadow:0 6px 0 #3f9e4c; margin-top:6px;}
  .cta:active{transform:translateY(4px); box-shadow:0 2px 0 #3f9e4c;}
  .cta.big{display:block; margin:22px auto 0;}

  .feedback{margin-top:14px; text-align:center; font-family:'Baloo 2'; font-weight:800; font-size:21px; min-height:28px;}
  .feedback.ok{color:var(--green);} .feedback.no{color:var(--magenta);} .feedback.hint{color:var(--purple);}
  .hintline{text-align:center; color:#8a7fc0; font-weight:700; margin-top:8px; font-size:15px;}
  .shake{animation:shk .4s;} @keyframes shk{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(6px)}50%{transform:translateX(-8px)}}

  .burst{position:fixed; inset:0; pointer-events:none; z-index:9; overflow:hidden;}
  .burst span{position:absolute; top:40%; font-size:26px; animation:fly 1s ease-out forwards;}
  @keyframes fly{to{transform:translate(var(--tx),var(--ty)) rotate(var(--r)); opacity:0}}

  .start-title{font-size:38px; text-align:center; color:var(--ink); line-height:1.1; margin:6px 0;}
  .start-sub{text-align:center; font-weight:700; color:#6a5aa8; font-size:18px; margin-bottom:6px;}
  .heroes{font-size:64px; text-align:center; margin:6px 0;}

  @media (max-width:480px){
    .story{font-size:18px} .question{font-size:20px}
    .start-title{font-size:30px} .scene-emoji{font-size:50px} .tile{width:64px;height:64px;font-size:20px}
  }
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;}}
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<div class="burst" id="burst"></div>
<div class="stage" id="stage"></div>

<script>
/* =========================================================
   DENEME-YANILMA GÖREVLERİ (3. sınıf)
   type: "guess"  -> gizli sayı, büyük/küçük ipucu
         "input"  -> sayı yaz; check(v) doğruysa true, değilse İPUCU metni döndürür
         "clue"   -> input ile aynı ama ipuçlarıyla
         "tiles"  -> taşlardan alt küme seç, toplam = hedef
   Her görevin özü: dene → ipucu al → düzelt.
   ========================================================= */
const SAHNELER = [
  {
    tag:"Dava 1 · Gizli Sayı", emoji:"🔒",
    story:"Dedektif, kasada <b>gizli bir sayı</b> saklı! 1 ile 50 arasında. Tahmin et, ben sana <b>“daha büyük”</b> mü <b>“daha küçük”</b> mü diyeyim.",
    question:"Gizli sayıyı bul!",
    hint:"Akıllı taktik: ortadan başla (25 gibi), ipucuna göre daralt.",
    type:"guess", min:1, max:50,
    ok:"Kasa açıldı! 🔓 Gizli sayıyı yakaladın, dedektif!",
    think:"Kaç denemede buldun? Hep ortadan bölerek denesen daha az denemede bulur muydun?"
  },
  {
    tag:"Dava 2 · Kayıp Çarpan", emoji:"✖️",
    story:"Bir çarpma işleminin bir sayısı silinmiş: <b>? × 7 = 42</b>. Kayıp sayıyı bulmalısın.",
    question:"? yerine hangi sayı gelmeli?",
    hint:"Dene: 5 × 7 kaç eder? Azsa büyüt, çoksa küçült.",
    type:"input", answer:6,
    check:function(v){ if(v===6) return true; const r=v*7;
      return r<42 ? `${v} × 7 = ${r}. Çok az, daha büyük dene ⬆` : `${v} × 7 = ${r}. Çok fazla, daha küçük dene ⬇`; },
    ok:"Buldun! 6 × 7 = 42. Kayıp çarpan yerine oturdu! 🧩",
    think:"Aslında bu bir bölme: 42 ÷ 7 = 6. Çarpmayı bilirsen bölmeyi de bilirsin."
  },
  {
    tag:"Dava 3 · Tam 20 Kasası", emoji:"🎯",
    story:"Kasayı açmak için taşları seçip <b>tam 20</b> yapmalısın. Fazlası da olmaz, azı da!",
    question:"Toplamı tam 20 yapan taşları seç",
    hint:"Dene-boz-tekrar dene. Az mı geldi, çok mu? Ekle ya da çıkar.",
    type:"tiles", degerler:[4,6,7,9,11], hedef:20,
    ok:"Tık! Kasa açıldı — toplam tam 20! 🔓",
    think:"Bir de FARKLI taşlarla 20 yapabilir misin? Kaç ayrı yol var?"
  },
  {
    tag:"Dava 4 · Adil Paylaşım", emoji:"🍬",
    story:"<b>25 şeker</b> var, <b>4 kutuya</b> eşit paylaştırılacak. Her kutuya <b>en fazla</b> kaç şeker eşit konabilir?",
    question:"Her kutuya en fazla kaç şeker?",
    hint:"Dene: 5 koyarsan? 6 koyarsan? 7 koyarsan? Hangisi 25'i geçmeden en çok?",
    type:"input", answer:6,
    check:function(v){ const t=v*4;
      if(t>25) return `${v} × 4 = ${t}. Ama sadece 25 şeker var, olmaz! Azalt ⬇`;
      if(v<6) return `${v} koyarsan ${25-t} şeker artar. Daha fazla konabilir ⬆`;
      return true; },
    ok:"Doğru! Her kutuya 6 şeker (6 × 4 = 24), geriye 1 şeker artar. 🍬",
    think:"Tam bölünmedi, 1 şeker arttı. Buna “kalan” denir. Neden tam bölünmedi?"
  },
  {
    tag:"Dava 5 · Şifreli Kilit", emoji:"🔢",
    story:"İki basamaklı <b>gizli bir şifre</b> var. Dedektif iki ipucu buldu:",
    clues:["Onlar basamağı 5","Rakamlarının toplamı 8"],
    question:"Şifre kaç?",
    hint:"İpuçlarını birlikte kullan: onlar 5 ise, birler kaç olmalı ki toplam 8 etsin?",
    type:"clue", answer:53,
    check:function(v){
      if(v<10||v>99) return "İki basamaklı bir sayı olmalı 🔎";
      const o=Math.floor(v/10), b=v%10;
      if(o!==5) return "Onlar basamağı 5 değil. İlk ipucuna bak 👀";
      if(o+b!==8) return `Onlar doğru! Ama ${o}+${b}=${o+b}, toplam 8 olmalı. Birler basamağını değiştir.`;
      return true; },
    ok:"Kilit açıldı! Şifre 53 (5 + 3 = 8). Süper dedektiflik! 🕵️",
    think:"İki ipucunu tek tek denemek yerine birleştirince tek cevap kalıyor. Fark ettin mi?"
  },
  {
    tag:"Dava 6 · Büyük Kasa", emoji:"💰",
    story:"Son dava! Büyük kasayı açmak için sayı taşlarından <b>tam 100</b> yapmalısın.",
    question:"Toplamı tam 100 yapan taşları seç",
    hint:"Büyük hedef! Büyükten başla, ipucuna göre (az/çok) taş ekle ya da çıkar.",
    type:"tiles", degerler:[40,30,25,20,15,10], hedef:100,
    ok:"Büyük kasa açıldı — tam 100! Sen usta bir sayı dedektifisin! 🎉",
    think:"Kaç farklı taş grubuyla 100 yapılabilir? Bir de dene bakalım."
  }
];

let idx=0, score=0, current=null, typedNum='', tries=0, tileSel=[];
const stage=document.getElementById('stage');
const burst=document.getElementById('burst');
const TOTAL=SAHNELER.length;

(function(){ const em=["🔍","🔒","❓","🔢","🕵️","💡","🧩","🔓"]; let s='';
  for(let i=0;i<16;i++){s+=`<i style="left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*10}s">${em[i%em.length]}</i>`;}
  document.getElementById('sky').innerHTML=s; })();

function railHTML(){ const pct=Math.round((score/TOTAL)*100);
  return `<div class="rail"><div class="track"><div class="fill" style="width:${pct}%"></div></div>
    <span class="badgemini">🕵️</span><span class="scorebox">🔓 ${score}/${TOTAL}</span></div>`; }

function starBurst(){ const emo=["🔓","⭐","🎉","💡","✨"]; let h='';
  for(let i=0;i<18;i++){ const tx=(Math.random()*2-1)*60+'vw', ty=(Math.random()*-1-0.2)*60+'vh', r=(Math.random()*720-360)+'deg';
    h+=`<span style="left:${40+Math.random()*20}%;--tx:${tx};--ty:${ty};--r:${r}">${emo[i%emo.length]}</span>`; }
  burst.innerHTML=h; setTimeout(()=>burst.innerHTML='',1000); }

function showStart(){
  stage.innerHTML=`<div class="heroes">🕵️🔍</div>
    <h1 class="start-title">Sayı Dedektifi</h1>
    <p class="start-sub">Kilitleri kır, şifreleri çöz! Dene, ipucu al, tekrar dene — matematikle!</p>
    <div class="scene-emoji">🔒🔢💡</div>
    <button class="cta big" onclick="startGame()">Göreve Başla ▶</button>
    <p class="hintline">6 dava var. Yanlış cevap da ipucu verir — denemekten korkma!</p>`;
}
function startGame(){ idx=0; score=0; renderStage(); }

function renderStage(){
  current=SAHNELER[idx]; typedNum=''; tries=0; tileSel=[];
  if(current.type==='guess'){ current.secret = current.min + Math.floor(Math.random()*(current.max-current.min+1)); }

  let cluesHTML = current.clues ? `<div class="clues">`+current.clues.map(c=>`<div class="clue"><span class="k">💡</span>${c}</div>`).join('')+`</div>` : '';
  let body='';
  if(current.type==='tiles'){
    body=`<div class="padwrap">
      <div class="display-num" id="disp">0</div>
      <div class="tiles" id="tiles">${current.degerler.map((v,i)=>`<button class="tile" id="t${i}" onclick="toggleTile(${i},${v})">${v}</button>`).join('')}</div>
      <button class="cta" onclick="checkTiles()">Kontrol Et ✓</button></div>`;
  } else {
    body=`<div class="padwrap"><div class="display-num" id="disp">0</div>
      <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" onclick="press(${n})">${n}</button>`).join('')}
      <button class="key act" onclick="press('del')">⌫</button>
      <button class="key" onclick="press(0)">0</button>
      <button class="key go" onclick="checkNum()">✓</button></div>
      ${current.type==='guess' ? `<div class="tries" id="tries">Deneme: 0</div>`:''}</div>`;
  }

  stage.innerHTML=railHTML()+`
    <span class="stage-tag">${current.tag}</span>
    <div class="scene-emoji">${current.emoji}</div>
    <div class="story">${current.story}</div>
    ${cluesHTML}
    <div class="question">${current.question}</div>
    ${body}
    <div class="hintline">${current.hint||''}</div>
    <div class="feedback" id="fb"></div>`;
}

function press(k){ const d=document.getElementById('disp');
  if(k==='del') typedNum=typedNum.slice(0,-1); else if(typedNum.length<3) typedNum+=k;
  d.textContent=typedNum===''?'0':typedNum; }

function checkNum(){
  if(typedNum==='') return;
  const v=parseInt(typedNum,10);
  const fb=document.getElementById('fb');

  if(current.type==='guess'){
    tries++; document.getElementById('tries').textContent='Deneme: '+tries;
    if(v===current.secret){ win(`Gizli sayı ${v} idi — ${tries} denemede buldun!`); return; }
    fb.className='feedback hint';
    fb.textContent = v<current.secret ? `${v}? Daha BÜYÜK bir sayı dene ⬆` : `${v}? Daha KÜÇÜK bir sayı dene ⬇`;
    typedNum=''; document.getElementById('disp').textContent='0';
    return;
  }
  // input / clue -> check() döndürür
  const res = current.check(v);
  if(res===true){ win(); }
  else { fb.className='feedback hint'; fb.textContent=res; typedNum=''; document.getElementById('disp').textContent='0'; }
}

function toggleTile(i,v){
  const el=document.getElementById('t'+i);
  const pos=tileSel.indexOf(i);
  if(pos>=0){ tileSel.splice(pos,1); el.classList.remove('on'); }
  else { tileSel.push(i); el.classList.add('on'); }
  const sum=tileSel.reduce((a,j)=>a+current.degerler[j],0);
  document.getElementById('disp').textContent=sum;
}
function checkTiles(){
  const sum=tileSel.reduce((a,j)=>a+current.degerler[j],0);
  const fb=document.getElementById('fb');
  if(sum===current.hedef){ win(); }
  else{ fb.className='feedback hint';
    fb.textContent = sum<current.hedef ? `${sum} — az geldi, taş ekle ⬆` : `${sum} — çok oldu, taş çıkar ⬇`; }
}

function win(extra){ score++; starBurst();
  const tb=current.think?`<div class="think">${current.think}</div>`:'';
  const last=idx===TOTAL-1;
  const ex = extra?`<div class="hintline" style="font-size:16px;color:var(--purple)">${extra}</div>`:'';
  stage.innerHTML=railHTML()+`
    <span class="stage-tag" style="background:var(--green)">🔓 Çözüldü!</span>
    <div class="scene-emoji">${current.emoji}</div>
    <div class="feedback ok" style="font-size:23px">${current.ok}</div>
    ${ex}${tb}
    <button class="cta big" onclick="${last?'showEnd()':'next()'}">${last?'Davayı Kapat 🏁':'Sıradaki Dava ➜'}</button>`;
}
function next(){ idx++; renderStage(); }

function showEnd(){
  stage.innerHTML=`<div class="heroes">🎉🕵️🔓</div>
    <h1 class="start-title">Tüm Davalar Çözüldü!</h1>
    <p class="start-sub">Bütün kilitleri kırdın. Artık gerçek bir Sayı Dedektifisin.</p>
    <div class="display-num" style="display:block;margin:14px auto;font-size:32px;">🔓 ${score}/${TOTAL}</div>
    <div class="think" style="justify-content:center">Hangi dava en çok deneme aldı? Yanlış denemeler sana ne öğretti?</div>
    <button class="cta big" onclick="startGame()">Yeniden Oyna 🔁</button>`;
  starBurst();
}

document.addEventListener('keydown',e=>{ if(!current||current.type==='tiles') return;
  if(/[0-9]/.test(e.key)) press(parseInt(e.key,10));
  else if(e.key==='Backspace') press('del'); else if(e.key==='Enter') checkNum(); });

showStart();
</script>
</body>
</html>
