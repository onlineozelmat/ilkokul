<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yıldız Tozu Görevi — Matematik Oyunu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --space1:#1a1246; --space2:#2a1a5e; --space3:#3d2478;
    --star:#FFD93D; --coral:#FF6B6B; --teal:#4ECDC4;
    --purple:#B388FF; --green:#6BCB77; --ink:#241a52;
    --card:#ffffff; --soft:#f2edff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Nunito',system-ui,sans-serif;
    background:radial-gradient(1200px 800px at 20% 0%, #3d2478 0%, var(--space2) 40%, var(--space1) 100%);
    color:var(--ink);
    min-height:100vh; overflow-x:hidden;
    display:flex; align-items:center; justify-content:center;
    padding:16px;
  }
  h1,h2,h3,.display{font-family:'Baloo 2',system-ui,sans-serif;}

  /* twinkling stars background */
  .sky{position:fixed; inset:0; z-index:0; pointer-events:none;}
  .sky i{position:absolute; width:3px; height:3px; border-radius:50%; background:#fff; opacity:.7;
    animation:tw 3s infinite ease-in-out;}
  @keyframes tw{0%,100%{opacity:.2; transform:scale(.6)}50%{opacity:1; transform:scale(1.2)}}

  .stage{
    position:relative; z-index:2;
    width:100%; max-width:640px;
    background:var(--card);
    border-radius:32px;
    padding:26px 24px 30px;
    box-shadow:0 24px 60px rgba(10,4,40,.55), inset 0 0 0 4px #fff;
    animation:pop .45s cubic-bezier(.2,1.3,.4,1);
  }
  @keyframes pop{from{transform:translateY(24px) scale(.94); opacity:0}to{transform:none; opacity:1}}

  /* progress rail */
  .rail{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
  .track{flex:1; height:16px; border-radius:20px; background:var(--soft); position:relative; overflow:hidden;}
  .fill{position:absolute; inset:0 auto 0 0; width:0%; border-radius:20px;
    background:linear-gradient(90deg,var(--teal),var(--purple),var(--coral)); transition:width .5s cubic-bezier(.2,1,.4,1);}
  .rocketmini{font-size:26px; transition:transform .5s ease;}
  .scorebox{font-family:'Baloo 2'; font-weight:800; color:var(--purple); font-size:20px; white-space:nowrap;}

  .scene-emoji{font-size:64px; text-align:center; line-height:1; margin:4px 0 6px;
    filter:drop-shadow(0 6px 0 rgba(0,0,0,.08)); animation:bob 2.4s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

  .stage-tag{display:inline-block; font-family:'Baloo 2'; font-weight:700; font-size:14px;
    color:#fff; background:var(--purple); padding:4px 14px; border-radius:999px; margin-bottom:8px;}
  .story{font-size:20px; line-height:1.5; font-weight:700; color:var(--ink); margin-bottom:6px;}
  .story b{color:var(--coral);}
  .think{background:var(--soft); border-radius:18px; padding:12px 16px; margin:14px 0 6px;
    font-weight:700; color:#5a3fb0; font-size:17px; display:flex; gap:10px; align-items:flex-start;}
  .think::before{content:"🤔"; font-size:20px;}
  .question{font-family:'Baloo 2'; font-weight:700; font-size:23px; color:var(--ink); margin:16px 0 14px;}

  /* choice buttons */
  .opts{display:grid; gap:12px; grid-template-columns:1fr 1fr;}
  .opt{font-family:'Baloo 2'; font-weight:700; font-size:26px; color:#fff; border:none; cursor:pointer;
    padding:20px 10px; border-radius:22px; box-shadow:0 6px 0 rgba(0,0,0,.18); transition:transform .12s, filter .12s;}
  .opt:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.18);}
  .opt:hover{filter:brightness(1.06);}
  .opt.c0{background:var(--coral)} .opt.c1{background:var(--teal)}
  .opt.c2{background:var(--purple)} .opt.c3{background:var(--green)}

  /* numeric input */
  .padwrap{display:flex; flex-direction:column; align-items:center; gap:14px;}
  .display-num{font-family:'Baloo 2'; font-weight:800; font-size:44px; color:var(--ink);
    background:var(--soft); min-width:150px; text-align:center; padding:8px 24px; border-radius:20px; letter-spacing:2px;}
  .pad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:100%; max-width:300px;}
  .key{font-family:'Baloo 2'; font-weight:700; font-size:26px; padding:14px 0; border:none; cursor:pointer;
    border-radius:16px; background:#fff; color:var(--ink); box-shadow:0 4px 0 #e0d7ff, inset 0 0 0 2px #efeaff;}
  .key:active{transform:translateY(3px); box-shadow:0 1px 0 #e0d7ff, inset 0 0 0 2px #efeaff;}
  .key.del{background:var(--star); box-shadow:0 4px 0 #d9b400;}

  /* build (open-ended) */
  .build-btns{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}
  .cell{font-family:'Baloo 2'; font-weight:700; font-size:20px; color:#fff; border:none; cursor:pointer;
    padding:16px 22px; border-radius:20px; box-shadow:0 5px 0 rgba(0,0,0,.2);}
  .cell.c20{background:var(--coral)} .cell.c10{background:var(--teal)} .cell.reset{background:#9aa; box-shadow:0 5px 0 #667;}
  .cell:active{transform:translateY(3px);}
  .fuelrow{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; min-height:34px; margin:4px 0;}
  .chip{font-family:'Baloo 2'; font-weight:700; color:#fff; padding:4px 12px; border-radius:12px; font-size:15px;}
  .chip.c20{background:var(--coral)} .chip.c10{background:var(--teal)}

  .cta{font-family:'Baloo 2'; font-weight:800; font-size:22px; color:#fff; border:none; cursor:pointer;
    background:var(--green); padding:14px 34px; border-radius:20px; box-shadow:0 6px 0 #3f9e4c; margin-top:8px;}
  .cta:active{transform:translateY(4px); box-shadow:0 2px 0 #3f9e4c;}
  .cta.big{display:block; margin:22px auto 0;}
  .center{text-align:center;}

  .feedback{margin-top:16px; text-align:center; font-family:'Baloo 2'; font-weight:800; font-size:22px; min-height:30px;}
  .feedback.ok{color:var(--green);}
  .feedback.no{color:var(--coral);}
  .hintline{text-align:center; color:#7a6fae; font-weight:700; margin-top:6px; font-size:15px;}

  .shake{animation:shk .4s;}
  @keyframes shk{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(6px)}50%{transform:translateX(-8px)}}

  /* burst */
  .burst{position:fixed; inset:0; pointer-events:none; z-index:9; overflow:hidden;}
  .burst span{position:absolute; top:40%; font-size:26px; animation:fly 1s ease-out forwards;}
  @keyframes fly{to{transform:translate(var(--tx),var(--ty)) rotate(var(--r)); opacity:0}}

  .start-title{font-size:40px; text-align:center; color:var(--ink); line-height:1.1; margin:6px 0;}
  .start-sub{text-align:center; font-weight:700; color:#6a5aa8; font-size:18px; margin-bottom:6px;}
  .heroes{font-size:70px; text-align:center; margin:6px 0;}

  @media (max-width:480px){
    .story{font-size:18px} .question{font-size:20px} .opt{font-size:22px; padding:16px 8px}
    .start-title{font-size:32px} .scene-emoji{font-size:52px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;}
  }
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<div class="burst" id="burst"></div>
<div class="stage" id="stage"></div>

<script>
/* =========================================================
   ETKİNLİK İÇERİĞİ — buradan kolayca değiştirebilirsin.
   type: "choice"  -> şıklı soru
         "input"   -> sayı yazma (tuş takımı)
         "build"   -> açık uçlu (birden çok doğru cevap)
   ========================================================= */
const SAHNELER = [
  {
    tag:"Görev 1 · Kalkış", emoji:"🚀",
    story:"Küçük astronot <b>Deniz</b>, roketine bindi. Kalkış için yakıt lazım! Roketin <b>4 dolu hücresi</b> var. Her hücrede <b>10 birim</b> yakıt var.",
    question:"Roketin toplam kaç birim yakıtı var?",
    hint:"İpucu: 10'ar 10'ar say → 10, 20, 30, ...",
    type:"input", answer:40,
    ok:"Harika! 4 hücre × 10 = 40 birim yakıt! 🔥",
    think:null
  },
  {
    tag:"Görev 2 · Yeterli mi?", emoji:"⛽",
    story:"Roko uyardı: <b>“Kalkış için tam 60 birim gerekiyor!”</b> Deniz'in ise 40 birim yakıtı var.",
    question:"Kalkabilmek için kaç birim yakıt EKSİK?",
    hint:"Önce tahmin et: eksik miktar 20'den az mı, çok mu? Sonra hesapla.",
    type:"input", answer:20,
    ok:"Doğru! 60 − 40 = 20 birim eksikti. Roko hücreleri doldurdu! 🛠️",
    think:null
  },
  {
    tag:"Görev 3 · Hangi gezegen?", emoji:"🪐",
    story:"Roket havada! İki gezegen göründü. <b>Kızıl Gezegen 35 birim</b> uzakta, <b>Mavi Gezegen 28 birim</b> uzakta.",
    question:"Daha AZ yakıt harcamak için hangisine gitmeli?",
    hint:"Hangi sayı daha küçük? Küçük sayı = daha yakın.",
    type:"choice",
    options:["Kızıl (35)","Mavi (28)","İkisi eşit","Bilinmez"],
    answer:1,
    ok:"Süper! 28 < 35, yani Mavi Gezegen daha yakın. Az yakıt, akıllı seçim! 🧠",
    think:"Nereden anladın? 28'de 2 onluk, 35'te 3 onluk var. Onlukları saydın mı?"
  },
  {
    tag:"Görev 4 · Göktaşı fırtınası", emoji:"☄️",
    story:"Aniden göktaşları geldi! Deniz kalkanı açtı ve <b>17 birim</b> yakıt harcadı. Deposunda <b>40 birim</b> vardı.",
    question:"Kalkandan sonra kaç birim yakıt kaldı?",
    hint:"Önce tahmin et: sonuç 20'den fazla mı? Sonra çıkar: 40 − 17.",
    type:"input", answer:23,
    ok:"Müthiş! 40 − 17 = 23 birim kaldı. Kalkan işe yaradı! 🛡️",
    think:"Onluk bozdun mu? 40'tan bir onluğu 10 bire çevirince çıkarma kolaylaşır."
  },
  {
    tag:"Görev 5 · Yıldız tozu", emoji:"✨",
    story:"Mavi Gezegen'de <b>3 küme</b> yıldız tozu var. Her kümede <b>12 tane</b> parlıyor.",
    question:"Toplam kaç yıldız tozu var?",
    hint:"İpucu: 12 + 12 + 12. Önce 12 + 12 = 24, sonra +12.",
    type:"input", answer:36,
    ok:"Vay! 12 + 12 + 12 = 36 yıldız tozu topladın! 🌟",
    think:"3 arkadaşına EŞİT paylaştırsan her birine kaç düşer? (36'yı 3 eşit gruba böl.)"
  },
  {
    tag:"Görev 6 · Eve dönüş", emoji:"🌍",
    story:"Eve dönmek için roketin <b>tam 50 birim</b> yakıta ihtiyacı var. Elinde <b>20'lik</b> ve <b>10'luk</b> yakıt hücreleri var.",
    question:"Tam 50 birim olacak şekilde hücre seç!",
    hint:"Birden fazla doğru yol var. Kaç farklı yol bulabilirsin? 🎯",
    type:"build", target:50,
    ok:"Tam 50! Roket eve doğru yola çıktı. Sen bir matematik kâşifisin! 🎉",
    think:"Bir de FARKLI bir yolla 50 yapabilir misin? Örn: 20+20+10 mu, 10+10+10+10+10 mu?"
  }
];

/* ---------- oyun durumu ---------- */
let idx = 0, score = 0, current = null, buildFuel = [];
const stage = document.getElementById('stage');
const burst = document.getElementById('burst');
const TOTAL = SAHNELER.length;

/* yıldızlı gökyüzü */
(function(){
  const sky=document.getElementById('sky'); let s='';
  for(let i=0;i<70;i++){s+=`<i style="left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s"></i>`;}
  sky.innerHTML=s;
})();

function railHTML(){
  const pct = Math.round((score/TOTAL)*100);
  return `<div class="rail">
    <div class="track"><div class="fill" style="width:${pct}%"></div></div>
    <span class="rocketmini" style="transform:rotate(${score?'-8':'0'}deg)">🚀</span>
    <span class="scorebox">⭐ ${score}/${TOTAL}</span>
  </div>`;
}

function starBurst(){
  const emo=["⭐","🌟","✨","💫","🎉"]; let h='';
  for(let i=0;i<18;i++){
    const tx=(Math.random()*2-1)*60+'vw', ty=(Math.random()*-1-0.2)*60+'vh', r=(Math.random()*720-360)+'deg';
    h+=`<span style="left:${40+Math.random()*20}%;--tx:${tx};--ty:${ty};--r:${r}">${emo[i%emo.length]}</span>`;
  }
  burst.innerHTML=h; setTimeout(()=>burst.innerHTML='',1000);
}

/* ---------- ekranlar ---------- */
function showStart(){
  stage.innerHTML = `
    <div class="heroes">🧑‍🚀🤖</div>
    <h1 class="start-title">Yıldız Tozu Görevi</h1>
    <p class="start-sub">Astronot Deniz ve robot Roko ile matematik yaparak uzayı keşfet!</p>
    <div class="scene-emoji">🚀🪐✨</div>
    <button class="cta big" onclick="startGame()">Göreve Başla ▶</button>
    <p class="hintline">6 görev var. Her doğru cevap roketi ileri götürür!</p>`;
}

function startGame(){ idx=0; score=0; renderStage(); }

function renderStage(){
  current = SAHNELER[idx];
  let body = '';
  if(current.type==='choice'){
    body = `<div class="opts">` + current.options.map((o,i)=>
      `<button class="opt c${i}" onclick="answerChoice(${i},this)">${o}</button>`).join('') + `</div>`;
  } else if(current.type==='input'){
    body = `<div class="padwrap">
      <div class="display-num" id="disp">0</div>
      <div class="pad">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" onclick="press(${n})">${n}</button>`).join('')}
        <button class="key del" onclick="press('del')">⌫</button>
        <button class="key" onclick="press(0)">0</button>
        <button class="key del" onclick="checkInput()">✓</button>
      </div>
    </div>`;
  } else if(current.type==='build'){
    buildFuel=[];
    body = `<div class="padwrap">
      <div class="display-num" id="disp">0</div>
      <div class="fuelrow" id="fuelrow"></div>
      <div class="build-btns">
        <button class="cell c20" onclick="addFuel(20)">+20</button>
        <button class="cell c10" onclick="addFuel(10)">+10</button>
        <button class="cell reset" onclick="resetFuel()">Sıfırla</button>
      </div>
      <button class="cta" onclick="checkBuild()">Kontrol Et ✓</button>
    </div>`;
  }

  stage.innerHTML = railHTML() + `
    <span class="stage-tag">${current.tag}</span>
    <div class="scene-emoji">${current.emoji}</div>
    <div class="story">${current.story}</div>
    <div class="question">${current.question}</div>
    ${body}
    <div class="hintline">${current.hint||''}</div>
    <div class="feedback" id="fb"></div>`;
  typedNum = '';
}

/* ---------- sayı tuş takımı ---------- */
let typedNum = '';
function press(k){
  const d=document.getElementById('disp');
  if(k==='del'){ typedNum = typedNum.slice(0,-1); }
  else { if(typedNum.length<3) typedNum += k; }
  d.textContent = typedNum===''?'0':typedNum;
}
function checkInput(){
  if(typedNum==='') return;
  const val = parseInt(typedNum,10);
  if(val===current.answer){ win(); }
  else { wrong(); }
}

/* ---------- şıklı ---------- */
function answerChoice(i,btn){
  if(i===current.answer){ win(); }
  else { sesYanlis();btn.classList.add('shake'); setTimeout(()=>btn.classList.remove('shake'),400); wrong(); }
}

/* ---------- açık uçlu ---------- */
function addFuel(v){
  buildFuel.push(v);
  document.getElementById('disp').textContent = buildFuel.reduce((a,b)=>a+b,0);
  document.getElementById('fuelrow').innerHTML =
    buildFuel.map(v=>`<span class="chip c${v}">${v}</span>`).join('');
}
function resetFuel(){
  buildFuel=[];
  document.getElementById('disp').textContent='0';
  document.getElementById('fuelrow').innerHTML='';
}
function checkBuild(){
  const sum = buildFuel.reduce((a,b)=>a+b,0);
  if(sum===current.target){ win(); }
  else {
    const fb=document.getElementById('fb'); fb.className='feedback no';
    fb.textContent = sum<current.target ? `Az geldi (${sum}). Biraz daha ekle!` : `Fazla oldu (${sum}). Sıfırla ve tekrar dene!`;
  }
}

/* ---------- geri bildirim ---------- */
function wrong(){
  const fb=document.getElementById('fb'); fb.className='feedback no';
  const msgs=["Yaklaştın! Tekrar dene 💪","Olmadı ama sorun değil, bir daha! 🔁","İpucuna bak ve yeniden dene 👀"];
  fb.textContent = msgs[Math.floor(Math.random()*msgs.length)];
  typedNum=''; const d=document.getElementById('disp'); if(d) d.textContent='0';
}

function win(){
  score++;
  starBurst();
  const thinkBlock = current.think ? `<div class="think">${current.think}</div>` : '';
  const last = idx===TOTAL-1;
  stage.innerHTML = railHTML() + `
    <span class="stage-tag" style="background:var(--green)">✓ Doğru!</span>
    <div class="scene-emoji">${current.emoji}</div>
    <div class="feedback ok" style="font-size:24px">${current.ok}</div>
    ${thinkBlock}
    <button class="cta big" onclick="${last?'showEnd()':'next()'}">${last?'Görevi Bitir 🏁':'Devam Et ➜'}</button>`;
}

function next(){ idx++; renderStage(); }

function showEnd(){
  stage.innerHTML = `
    <div class="heroes">🎉🚀🌍</div>
    <h1 class="start-title">Görev Tamamlandı!</h1>
    <p class="start-sub">Deniz ve Roko sayende güvenle eve döndü.</p>
    <div class="display-num" style="display:block;margin:14px auto;font-size:34px;">⭐ ${score}/${TOTAL} yıldız</div>
    <div class="think" style="justify-content:center">Bugün ne öğrendin? En zor görev hangisiydi, neden?</div>
    <button class="cta big" onclick="startGame()">Yeniden Oyna 🔁</button>`;
  starBurst();
}

/* klavyeyle de oynanabilsin (projeksiyon/bilgisayar) */
document.addEventListener('keydown',e=>{
  if(!current) return;
  if(current.type==='input'){
    if(/[0-9]/.test(e.key)) press(parseInt(e.key,10));
    else if(e.key==='Backspace') press('del');
    else if(e.key==='Enter') checkInput();
  }
});

showStart();

/* === SES MOTORU (power-up doğru / buzzer yanlış) === */
(function(){
  var sesAcik=true, actx=null, sonSes=0;
  function AC(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } } return actx; }
  function ton(f,st,du,tp,vol){ var a=AC(); if(!a) return; var o=a.createOscillator(), g=a.createGain();
    o.type=tp||'sine'; o.frequency.value=f; o.connect(g); g.connect(a.destination);
    var t=a.currentTime+st; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+du); o.start(t); o.stop(t+du+0.03); }
  function gate(){ var n=Date.now(); if(n-sonSes<120) return false; sonSes=n; return true; }
  window.sesDogru=function(){ if(!sesAcik||!gate()) return; [392,523,659,784,988,1319].forEach(function(f,i){ ton(f,i*0.05,0.12,'square',0.16); }); };
  window.sesYanlis=function(){ if(!sesAcik||!gate()) return; ton(300,0,0.16,'sawtooth',0.2); ton(200,0.15,0.22,'sawtooth',0.2); };
  window.sesToggle=function(){ sesAcik=!sesAcik; var b=document.getElementById('sesBtn'); if(b) b.textContent=sesAcik?'🔊':'🔇'; };
  function ekleBtn(){ if(document.getElementById('sesBtn')) return; var b=document.createElement('button'); b.id='sesBtn';
    b.textContent='🔊'; b.title='Ses aç/kapa'; b.setAttribute('onclick','sesToggle()');
    b.style.cssText='position:fixed;top:10px;right:10px;z-index:9999;border:none;cursor:pointer;font-size:20px;background:rgba(255,255,255,.9);border-radius:999px;width:42px;height:42px;box-shadow:0 3px 8px rgba(0,0,0,.25)';
    if(document.body) document.body.appendChild(b); }
  if(document.readyState!=='loading') ekleBtn(); else document.addEventListener('DOMContentLoaded',ekleBtn);
  function sar(name,ses){ if(typeof window[name]==='function'){ var o=window[name]; window[name]=function(){ ses(); return o.apply(this,arguments); }; return true; } return false; }
  sar('burstFx',window.sesDogru) || sar('starBurst',window.sesDogru);
  sar('wrong',window.sesYanlis); sar('yanlis',window.sesYanlis);
})();

</script>
</body>
</html>
